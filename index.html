<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Controle financeiro 2026</title>
<style>html,body{margin:0;padding:0;background:#F2F3EE;padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div id="app">
  <div id="boot" class="boot"><div class="spinner"></div><span>Abrindo seu controle…</span></div>
</div>
<input type="file" id="arqBackup" accept="application/json" style="display:none">

<style>
  :root{
    --paper:#F2F3EE;
    --card:#FFFFFF;
    --ink:#1B2A2E;
    --muted:#5E6B6B;
    --rule:#D8DBD3;
    --rule-soft:#E7E9E3;
    --green:#2E6B4E;
    --green-esc:#1B4A37;
    --red:#9A3B2C;
    --amber:#8C6712;
    --azul:#2A5FA8;
    --azul-esc:#1E3F70;
    --violeta:#7A4FB0;
    --violeta-esc:#4F3178;
    --indigo:#35528F;
    --indigo-esc:#233A66;
    --rose:#A8496B;
    --rose-esc:#722F49;
    --ambron:#8C6712;
    --ambron-esc:#5E430C;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(27,42,46,.05),0 1px 1px rgba(27,42,46,.04);
    --shadow-md:0 2px 6px rgba(27,42,46,.05),0 12px 28px rgba(27,42,46,.08);
    --ring:0 0 0 3px rgba(27,42,46,.09);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  #app *{box-sizing:border-box}
  #app{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.45;padding:0 0 64px}
  #app button{font-family:inherit;font-size:inherit;cursor:pointer}
  #app input,#app select,#app textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
  .num,.val{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .boot{padding:48px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--green);animation:girar .8s linear infinite}
  .spinner.sm{width:16px;height:16px;border-width:2px}
  @keyframes girar{to{transform:rotate(360deg)}}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 16px;flex-wrap:wrap}
  .mesnav{display:flex;align-items:center;gap:8px}
  .mesnav h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;min-width:170px;text-align:center}
  .arrow{border:none;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
  .arrow:hover{box-shadow:var(--shadow-md)}
  .arrow:active{transform:scale(.94)}
  .arrow:disabled{opacity:.35;box-shadow:none;background:transparent;cursor:default;transform:none}
  .toolbtn{border:none;background:var(--card);color:var(--muted);padding:8px 15px;border-radius:999px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,color .15s}
  .toolbtn:hover{color:var(--ink);box-shadow:var(--shadow-md)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}

  .hero{background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);padding:28px 26px 24px;margin-bottom:20px;box-shadow:var(--shadow-md)}
  .hero.hero-jobs{background:linear-gradient(155deg,var(--indigo-esc),var(--indigo))}
  .hero.hero-cartoes{background:linear-gradient(155deg,var(--rose-esc),var(--rose))}
  .hero.hero-financ{background:linear-gradient(155deg,var(--ambron-esc),#B4870F)}
  .hero.hero-invest{background:linear-gradient(155deg,var(--green-esc),var(--green))}
  .hero-label{font-size:13px;color:rgba(242,243,238,.68);margin-bottom:2px}
  .hero-num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:54px;line-height:1.02;font-weight:600;letter-spacing:-0.02em}
  .hero-num.neg{color:#F2C4B4}
  .hero-sub{font-size:13px;color:rgba(242,243,238,.68);margin-top:8px;max-width:54ch}
  .hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px 22px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(242,243,238,.16)}
  .hero-cell span{display:block;font-size:12px;color:rgba(242,243,238,.68)}
  .hero-cell b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}

  .cartao-boxes{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .cartao-box{flex:1;min-width:170px;border-radius:var(--radius-md);padding:18px 20px;color:var(--paper);box-shadow:var(--shadow-sm)}
  .cartao-box span{display:block;font-size:12.5px;color:rgba(242,243,238,.75)}
  .cartao-box b{display:block;font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;margin-top:4px}
  .cartao-box.c-azul{background:linear-gradient(155deg,var(--azul-esc),var(--azul))}
  .cartao-box.c-ultravioleta{background:linear-gradient(155deg,var(--violeta-esc),var(--violeta))}

  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:#0A0A0A;
    color:#F5F5F5;
  }
  .login-card{
    width:min(100%,466px);
    background:#181818;
    border:1px solid #303030;
    border-radius:18px;
    padding:28px 30px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.28);
  }
  .login-card h1{
    margin:0 0 5px;
    font-family:var(--sans);
    font-size:20px;
    line-height:1.3;
    font-weight:650;
    letter-spacing:-.02em;
    color:#F4F4F4;
  }
  .login-subtitle{
    margin:0 0 30px;
    color:#999;
    font-size:15px;
    line-height:1.5;
  }
  .login-field{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:24px;
  }
  .login-field label{
    font-size:14px;
    font-weight:600;
    color:#E8E8E8;
  }
  .login-field input{
    width:100%;
    height:44px;
    padding:0 14px;
    border:1px solid #414141;
    border-radius:9px;
    background:#222;
    color:#F2F2F2 !important;
    font-family:var(--sans);
    font-size:15px;
    outline:none;
   transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .login-field input::placeholder{color:#888}
  .login-field input:focus{
    border-color:#666;
    background:#242424;
    box-shadow:0 0 0 3px rgba(255,255,255,.07);
  }
  .login-password{margin-bottom:28px}
  .login-lembrar{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#C7C7C7;margin-bottom:22px;cursor:pointer;user-select:none}
  .login-lembrar input{width:16px;height:16px;accent-color:#E8E8E8;cursor:pointer}
  .login-btn{
    width:100%;
    height:44px;
    border:1px solid #3D3D3D;
    border-radius:9px;
    background:#242424;
    color:#F3F3F3;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .login-btn:hover{background:#2C2C2C;border-color:#505050}
  .login-btn:active{transform:scale(.995)}
  .login-btn:disabled{opacity:.55;cursor:default;transform:none}
  .login-error{margin-bottom:20px;background:#3A1E1A;color:#F0B7AD;border:1px solid #5A2B24}
  @media(max-width:520px){
    .login-screen{padding:20px 16px}
    .login-card{padding:24px 20px 22px;border-radius:14px}
    .login-subtitle{font-size:14px;margin-bottom:26px}
  }

  .field{display:flex;flex-direction:column;gap:4px}
  .field-row{display:flex;gap:12px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select{border:1px solid var(--rule);background:#fff;border-radius:var(--radius-sm);padding:7px 10px;height:38px;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:var(--ring)}
  #app .w-val{width:128px;text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}
  .field input[type=date]{font-size:13.5px;color:var(--ink);max-width:150px}

  section{background:var(--card);border-radius:var(--radius-lg);padding:24px 26px 22px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule-soft);padding-bottom:14px;margin-bottom:8px}
  .sec-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
  .sec-total{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .sec-note{font-size:12.5px;color:var(--muted);padding:7px 0 0;max-width:70ch}

  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 8px 8px;border-bottom:1px solid var(--rule-soft);text-transform:uppercase;letter-spacing:.03em}
  td{padding:11px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .linha-total td{background:#F3F5EF;padding-top:13px;padding-bottom:13px}
  .linha-total td:first-child{padding-left:10px;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
  .linha-total td:last-child{padding-right:10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  th:first-child,td:first-child{padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  .r{text-align:right}.c{text-align:center}
  .nome{font-weight:500}
  .ib-filmes{text-transform:uppercase;font-weight:700;letter-spacing:.01em}
  .dim{color:var(--muted);font-size:13px}

  .chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:500}
  .chip.pago{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.apagar{border-color:transparent;background:#F6EFDC;color:var(--amber)}
  .chip.vencido{border-color:transparent;background:#F6E5E1;color:var(--red)}
  .chip.parcela{border-color:transparent;background:#F1E9F8;color:var(--violeta-esc)}
  .chip.avulsa{border-color:var(--rule);background:#fff;color:var(--muted)}
  .chip.inv-selic{border-color:transparent;background:#E7EFF9;color:var(--azul-esc)}
  .chip.inv-cdb{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.inv-cdi{border-color:transparent;background:#F1E9F8;color:var(--violeta-esc)}
  .chip.inv-acao{border-color:transparent;background:#F7E8EE;color:var(--rose-esc)}
  .chip.ganho{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.perda{border-color:transparent;background:#F6E5E1;color:var(--red)}
  .venc.alerta{color:var(--red)}
  .venc{font-size:12px;color:var(--muted)}

  #app .inline-val{border:1px solid transparent;background:transparent;width:104px;text-align:right;padding:5px 8px;border-radius:var(--radius-sm);font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px;transition:border-color .15s,box-shadow .15s}
  .inline-val:hover{border-color:var(--rule);background:#fff}
  .inline-val:focus{border-color:var(--ink);background:#fff;outline:none;box-shadow:var(--ring)}
  .del{border:none;background:transparent;color:#AAB4B2;font-size:17px;line-height:1;padding:4px 6px;border-radius:var(--radius-sm);transition:color .15s,background .15s}
  .del:hover{color:var(--red);background:#F6E5E1}

  .adder{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 0 2px;border-top:1px solid var(--rule-soft);margin-top:4px}
  .addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-sm);padding:0 18px;height:38px;box-shadow:var(--shadow-sm);transition:background .15s,box-shadow .15s}
  .addbtn:hover{background:#2A3E42;box-shadow:var(--shadow-md)}
  .addbtn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:0 16px;height:38px;transition:background .15s}
  .ghost:hover{background:#EFF1EA}
  .vazio{padding:16px 0;color:var(--muted);font-size:13.5px}

  /* importação por texto */
  .import{border:1px solid var(--rule-soft);border-radius:var(--radius-md);background:#F8F9F5;padding:18px 20px;margin-bottom:6px}
  .import h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
  .import p{margin:0 0 13px;font-size:13px;color:var(--muted);max-width:66ch}
  .imp-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  textarea{width:100%;min-height:92px;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;resize:vertical;font-size:14px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
  .lendo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:18px 0}
  .spin{width:15px;height:15px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .erro{background:#F6E5E1;border:none;color:var(--red);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin-bottom:12px}
  .revisar{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
  .revisar table{font-size:14px}
  #app .revisar select{border:1px solid var(--rule);background:#fff;border-radius:var(--radius-sm);padding:3px 5px;height:29px;font-size:13px;max-width:130px}
  .revisar .inline-val{width:96px}
  .rev-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px}
  .rev-info{font-size:13px;color:var(--muted)}

  .catdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;position:relative;top:-1px}
  .catsel{display:inline-flex;align-items:center;border-radius:999px;padding:3px 6px 3px 11px}
  #app .catsel select.mini{margin-top:0;font-size:12px;font-weight:600;padding:1px 2px}

  .conta-bloco{border:1px solid var(--rule-soft);border-radius:var(--radius-md);margin-top:14px;overflow:hidden}
  .conta-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;background:#EAEDE5;border-left:4px solid var(--rule)}
  button.conta-top{width:100%;border:none;cursor:pointer;font:inherit;color:inherit;-webkit-appearance:none;appearance:none;align-items:center}
  .chev{display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:14px;line-height:1}
  .chev.aberto{transform:rotate(90deg)}

  .hamburger{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:40;width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--card);box-shadow:var(--shadow-sm);font-size:16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .hamburger.olho{left:auto;right:16px;font-size:17px}
  .menu-overlay{position:fixed;inset:0;background:rgba(27,42,46,.35);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:48;border:none;padding:0;margin:0;-webkit-appearance:none;appearance:none}
  .menu-overlay.aberto{opacity:1;pointer-events:auto}
  .menu-lateral{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--card);z-index:49;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 24px;box-shadow:2px 0 18px rgba(27,42,46,.14);transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto}
  .menu-lateral.aberto{transform:translateX(0)}
  .menu-conta{padding-bottom:16px;border-bottom:1px solid var(--rule-soft);margin-bottom:18px}
  .menu-avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:10px}
  .menu-conta-nome{font-weight:600;color:var(--ink);margin-bottom:12px}
  .menu-secao-titulo{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 8px;border:none;background:transparent;border-radius:var(--radius-sm);font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
  .menu-item:hover{background:var(--paper)}
  .menu-item.perigo{color:var(--red);margin-top:10px;border-top:1px solid var(--rule-soft);padding-top:16px;border-radius:0}
  .conta-top.c-azul{background:#E7EFF9;border-left-color:var(--azul)}
  .conta-top.c-ultravioleta{background:#F1E9F8;border-left-color:var(--violeta)}
  .conta-top.c-verde{background:#E7F1EA;border-left-color:var(--green)}
  .conta-top b{font-size:14.5px}
  .conta-top .val{font-size:18px;font-weight:600}
  .conta-body{padding:4px 16px 8px}
  .conta-body table{font-size:14px}
  .conta-body h4{margin:14px 0 2px;font-size:12.5px;color:var(--muted);font-weight:600}
  .conta-body h4:first-child{margin-top:10px}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
  .fchip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);transition:background .15s,color .15s}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:var(--shadow-md)}
  .rodape{border-top:none;padding-top:6px;font-size:12.5px;color:var(--muted);max-width:68ch}

  .abas{display:flex;gap:2px;padding:5px;margin-bottom:22px;background:#E6E8E0;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto}
  .aba{border:none;background:transparent;color:var(--muted);padding:9px 17px;border-radius:999px;font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
  .aba:hover{color:var(--ink)}
  .aba[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
  .aba[data-vista="jobs"][aria-pressed="true"]{background:#E7EAF6;color:var(--indigo-esc)}
  .aba[data-vista="cartoes"][aria-pressed="true"]{background:#F5E9EF;color:var(--rose-esc)}
  .aba[data-vista="financ"][aria-pressed="true"]{background:#F5ECD6;color:var(--ambron-esc)}
  .aba[data-vista="invest"][aria-pressed="true"]{background:#E7F1EA;color:var(--green-esc)}
  .aba[data-vista="resumo"][aria-pressed="true"]{background:#E3F1E7;color:#1E4A38}
  .hero.hero-resumo{background:linear-gradient(155deg,#1E4A38,var(--green))}

  .barras{display:flex;align-items:flex-end;gap:6px;height:190px;padding:12px 0 0}
  .barra-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .barra-topo{height:18px;text-align:center}
  .barra-val{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
  .barra-trilho{flex:1;display:flex;align-items:flex-end;background:#E7E9E3;border-radius:5px 5px 0 0}
  .barra-fill{width:100%;background:#8FA69C;border-radius:5px 5px 0 0}
  .barra-fill.alto{background:var(--ink)}
  .barra-rot{text-align:center;font-size:11.5px;color:var(--muted);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tipos{display:flex;gap:16px;flex-wrap:wrap;padding:14px 0 2px}
  .tipo-bloco{flex:1;min-width:180px}
  .tipo-rot{font-size:13px;color:var(--muted)}
  .tipo-val{font-size:21px;font-weight:600}
  .tipo-dim{font-size:12.5px;color:var(--muted)}
  #app select.mini{border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;padding:1px 3px;border-radius:var(--radius-sm);margin-top:2px}
  #app select.mini:hover{border-color:var(--rule);background:#fff;color:var(--ink)}

<script>
(function(){
  // window.storage agora fala com a API da Vercel (/api/kv), que guarda
  // tudo num banco Postgres — os dados deixam de ficar presos a um
  // navegador/aparelho específico. Se a sessão de login expirar, as
  // chamadas voltam 401 e a gente aciona window.__onUnauthorized (definida
  // no script principal) pra mostrar a tela de senha de novo.
  function semAuth(){
    if(window.__onUnauthorized) window.__onUnauthorized();
    var e=new Error('unauthorized'); e.unauthorized=true; throw e;
  }
  window.storage = {
    get: async function(k){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k));
      if(resp.status===401) semAuth();
      if(resp.status===404){ var e=new Error('not found'); e.notFound=true; throw e; }
      if(!resp.ok) throw new Error('Erro '+resp.status+' ao ler o servidor.');
      var data=await resp.json();
      return {key:data.key, value:data.value};
    },
    set: async function(k,v){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k),{
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value:v})
      });
      if(resp.status===401) semAuth();
      if(!resp.ok) return null;
      return {key:k, value:v};
    },
    list: async function(prefix){
      var resp=await fetch('/api/kv?prefix='+encodeURIComponent(prefix||''));
      if(resp.status===401) semAuth();
      if(!resp.ok) throw new Error('Erro '+resp.status+' ao listar no servidor.');
      var data=await resp.json();
      return {keys:data.keys||[]};
    },
    delete: async function(k){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k),{method:'DELETE'});
      if(resp.status===401) semAuth();
      return {key:k, deleted:true};
    }
  };
})();
</script>

  function categoriaAuto(desc){
    var d=String(desc||'');
    for(var i=0;i<REGRAS_CATEGORIA.length;i++){ if(REGRAS_CATEGORIA[i][1].test(d)) return REGRAS_CATEGORIA[i][0]; }
    return 'Outros';
  }
  function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  var MAPA_CAT_NORM=(function(){ var m={}; CATEGORIAS.forEach(function(c){ m[semAcento(c)]=c; }); return m; })();
  var RX_SEP_TOKEN=/^[-–—•|,;:]+$/;
  function limpaToken(t){ return String(t||'').replace(/^[-–—•|,;:()]+/,'').replace(/[-–—•|,;:()]+$/,''); }
  function extraiCategoriaExplicita(l){
    var tokens=l.split(/\s+/);
    for(var i=0;i<tokens.length;i++){
      var chave=semAcento(limpaToken(tokens[i]));
      if(MAPA_CAT_NORM[chave]){
        var cat=MAPA_CAT_NORM[chave];
        tokens.splice(i,1);
        if(i>0&&RX_SEP_TOKEN.test(tokens[i-1])) tokens.splice(i-1,1);
        else if(i<tokens.length&&RX_SEP_TOKEN.test(tokens[i])) tokens.splice(i,1);
        return {categoria:cat, resto:tokens.join(' ').trim()};
      }
    }
    return null;
  }

  // ---------- leitura de fatura por texto ou imagem ----------
  function promptExtracao(){
    return 'Você está lendo um extrato de cartão de crédito ou de conta bancária brasileira, enviado como texto ou imagem.\n'+
      'Em imagens de aplicativo bancário, cada linha com nome de estabelecimento e valor em R$ é uma compra. Extraia TODAS as compras visíveis, mesmo quando a data vier apenas no cabeçalho acima delas. Por exemplo, "ontem, 17 de maio" vale para todas as linhas seguintes até aparecer outro cabeçalho de data. Textos como "apple pay", "cartão físico" e ícones são apenas detalhes do meio de pagamento, não são compras separadas.\n'+
      'Extraia SOMENTE os gastos (débitos/compras). Ignore pagamentos de fatura, estornos, créditos, saldos, limites, totais da fatura e qualquer linha que não seja uma compra.\n'+
      'Para cada gasto devolva: data (formato AAAA-MM-DD; se o texto não trouxer o ano, use '+mesId.split('-')[0]+'; se não trouxer nem o mês, use '+mesId+'), descricao (nome do estabelecimento, limpo e curto, sem incluir a categoria; se houver parcela mantenha no formato "Nome (2/6)"), valor (número positivo com ponto decimal) e categoria (exatamente uma de: '+CATEGORIAS.join(', ')+' — se o texto já disser a categoria daquele gasto, use essa categoria informada; só infira pelo nome do estabelecimento quando não vier explícita).\n'+
      'Responda APENAS com um array JSON, sem texto antes ou depois, sem markdown, sem crase. Exemplo: [{"data":"2026-08-12","descricao":"Posto Shell","valor":180.5,"categoria":"Transporte"}]';
  }

  async function lerComIA(entrada){
    var content=Array.isArray(entrada)?entrada:[{type:'text',text:'Extrato colado:\n'+entrada}];
    content.push({type:'text',text:promptExtracao()});
    var resp=await fetch('/api/read-receipt',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:content})
    });
    var data=await resp.json();
    if(!resp.ok) throw new Error(data.error||'Não foi possível ler a fatura agora.');
    var txt=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
    txt=txt.replace(/```json/g,'').replace(/```/g,'').trim();
    var ini=txt.indexOf('['), fim=txt.lastIndexOf(']');
    if(ini>-1&&fim>ini) txt=txt.slice(ini,fim+1);
    var arr=JSON.parse(txt);
    if(!Array.isArray(arr)) throw new Error('formato');
    return arr;
  }

  var NAO_GASTO=/pagamento|estorno|cr[ée]dito|limite|saldo|dispon[íi]vel|total da fatura|fatura anterior|fatura fechada|transfer[êe]ncia recebida|recebid/i;

  function lerTextoLocal(texto){
    var out=[];
    texto.split(/\n+/).forEach(function(linha){
      var l=linha.trim(); if(!l) return;
      if(NAO_GASTO.test(l)) return;
      var catExplicita=null;
      var achou=extraiCategoriaExplicita(l);
      if(achou){ catExplicita=achou.categoria; l=achou.resto; }
      var mv=l.match(/(-?\s*(?:R\$)?\s*\d{1,3}(?:\.\d{3})*,\d{2}|\d+[.,]\d{2})\s*$/);
      if(!mv) return;
      var valor=parseNum(mv[1]); if(!valor) return;
      var resto=l.slice(0,l.length-mv[0].length).trim();
      var md=resto.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      var data=mesId+'-01';
      if(md){
        var ano=md[3]?(md[3].length===2?'20'+md[3]:md[3]):mesId.split('-')[0];
        data=ano+'-'+String(md[2]).padStart(2,'0')+'-'+String(md[1]).padStart(2,'0');
        resto=resto.slice(md[0].length).trim();
      }
      resto=resto.replace(/^[\-–•|,;]+/,'').trim();
      if(!resto) resto='Gasto';
      out.push({data:data,descricao:resto,valor:Math.abs(valor),categoria:catExplicita||categoriaAuto(resto)});
    });
    return out;
  }

  var RX_PARCELA=/\(?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)?\s*$/;
  function detectaParcela(desc){
    var m=String(desc||'').match(RX_PARCELA);
    if(!m) return null;
    var atual=+m[1], total=+m[2];
    if(!atual||!total||atual>total||total>60) return null;
    return {atual:atual,total:total};
  }
  function nomeSemParcela(desc){ return String(desc||'').replace(RX_PARCELA,'').trim(); }

  function somaMesesData(d,n){
    var p=String(d||'').split('-'); if(p.length<3) return d;
    var y=+p[0], mo=+p[1]+n, dia=+p[2];
    while(mo>12){ mo-=12; y++; }
    while(mo<1){ mo+=12; y--; }
    var ultimoDia=new Date(y,mo,0).getDate();
    dia=Math.min(dia,ultimoDia);
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
  }

  async function mesGarantido(id){
    var m=await sget(keyMes(id));
    if(!m){
      m=mesNovo(id,cfg);
      await sset(keyMes(id),m);
      meses=await carregarMeses();
    }
    return m;
  }

  // gera nos meses seguintes as parcelas que ainda faltam (atual+1 até total),
  // mantendo o mesmo cartão/categoria/valor e avançando a data mês a mês.
  async function propagarParcelas(base,pc){
    if(!pc||pc.total<=1||pc.atual>=pc.total) return 0;
    var nomeBase=nomeSemParcela(base.descricao);
    var id=mesId, criadas=0;
    for(var i=pc.atual+1;i<=pc.total;i++){
      id=proxId(id);
      var mm=await mesGarantido(id);
      var descNova=nomeBase+' ('+i+'/'+pc.total+')';
      var jaExiste=mm.lancamentos.some(function(l){return l.conta===base.conta&&l.descricao===descNova&&Math.abs((+l.valor||0)-(+base.valor||0))<0.005;});
      if(jaExiste) continue;
      mm.lancamentos.push({
        id:uid(),
        data:somaMesesData(base.data,i-pc.atual),
        descricao:descNova,
        categoria:base.categoria,
        valor:base.valor,
        conta:base.conta,
        parcelado:true
      });
      await sset(keyMes(id),mm);
      criadas++;
    }
    return criadas;
  }

  function normalizar(arr){
    return arr.map(function(x){
      var d=String(x.data||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=mesId+'-01';
      var desc=String(x.descricao||'Gasto').slice(0,80);
      var cat=CATEGORIAS.indexOf(x.categoria)>-1?x.categoria:categoriaAuto(desc);
      var pc=detectaParcela(desc);
      return {tid:uid(),data:d,descricao:desc,valor:Math.abs(+x.valor||0),categoria:cat,usar:true,parcelado:!!pc,parcelaInfo:pc?(pc.atual+'/'+pc.total):''};
    }).filter(function(x){ return x.valor>0; });
  }

  async function processar(texto){
    imp.carregando=true; imp.erro=null; imp.itens=null; render();
    try{
      var arr=await lerComIA(texto);
      imp.itens=normalizar(arr);
      if(!imp.itens.length) imp.erro='Não encontrei nenhum gasto nesse texto.';
    }catch(e){
      var loc=normalizar(lerTextoLocal(texto));
      if(loc.length){ imp.itens=loc; imp.erro='Li o texto sem a ajuda da IA, então as categorias foram um chute a partir do nome. Confira antes de lançar.'; }
      else imp.erro='Não consegui entender esse texto. Cada linha precisa ter um valor no formato 47,90 — data e categoria são opcionais.';
    }
    imp.carregando=false; render();
  }

  function reduzirImagemFatura(arquivo){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(arquivo), imagem=new Image();
      imagem.onload=function(){
        try{
          var limite=1600, escala=Math.min(1,limite/Math.max(imagem.naturalWidth,imagem.naturalHeight));
          var canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(imagem.naturalWidth*escala));
          canvas.height=Math.max(1,Math.round(imagem.naturalHeight*escala));
          var ctx=canvas.getContext('2d');
          ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(imagem,0,0,canvas.width,canvas.height);
          URL.revokeObjectURL(url); imagem.src=''; imagem=null;
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('compressão')); return; }
            var leitor=new FileReader();
            leitor.onload=function(){
              var base64=String(leitor.result||'').split(',')[1];
              canvas.width=1; canvas.height=1; canvas=null;
              if(!base64){ reject(new Error('leitura')); return; }
              resolve({type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}});
            };
            leitor.onerror=function(){ reject(new Error('leitura')); };
            leitor.readAsDataURL(blob);
          },'image/jpeg',.78);
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      imagem.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
      imagem.src=url;
    });
  }

  async function processarImagens(arquivos){
    var limiteArquivos=6, maxOriginal=8*1024*1024;
    var lista=arquivos.slice(0,limiteArquivos), extraidos=[], falhas=[];
    if(arquivos.length>limiteArquivos) toast('Vou ler os primeiros '+limiteArquivos+' prints.');
    arquivos=null;
    imp.carregando=true; imp.erro=null; imp.itens=null; imp.progresso={atual:0,total:lista.length}; render();
    for(var i=0;i<lista.length;i++){
      imp.progresso={atual:i+1,total:lista.length}; render();
      var arquivo=lista[i];
      try{
        if(arquivo.size>maxOriginal) throw new Error('arquivo grande');
        var imagem=await reduzirImagemFatura(arquivo);
        var arr=await lerComIA([imagem]);
        imagem=null;
        extraidos=extraidos.concat(arr);
      }catch(e){ falhas.push(arquivo.name||('print '+(i+1))); }
      finally{ lista[i]=null; arquivo=null; }
    }
    imp.itens=normalizar(extraidos);
    imp.carregando=false; imp.progresso=null;
    if(!imp.itens.length){
      imp.itens=null;
      imp.erro=falhas.length?'Não consegui concluir a leitura do print. Tente enviar novamente; o arquivo não foi salvo.':'Não encontrei compras neste print. Tente enviar novamente — telas com linhas de estabelecimento e valor em R$ são aceitas.';
    }
    else if(falhas.length) imp.erro='Não consegui ler: '+falhas.join(', ')+'. Os demais lançamentos foram mantidos para revisão.';
    render();
  }

  var TIPOS=[{id:'recorrente',rot:'Recorrente'},{id:'avulso',rot:'Avulso'},{id:'freela',rot:'Freela'}];
  function tipoJob(j){ return TIPOS.filter(function(t){return t.id===j.tipo;})[0]?j.tipo:'avulso'; }
  function rotTipo(id){ var t=TIPOS.filter(function(x){return x.id===id;})[0]; return t?t.rot:'Avulso'; }

  // ---------- faturamento ----------
  function jobsDoMes(id){ return jobs.filter(function(j){return j.mes===id;}); }
  function totJobsMes(id){ return jobsDoMes(id).reduce(function(a,j){return a+(+j.valor||0);},0); }
  function recebidoJob(j){ return +j.recebido||0; }
  function abertoJob(j){ return Math.max((+j.valor||0)-recebidoJob(j),0); }
  function statusJob(j){
    var r=recebidoJob(j);
    if(r<=0) return {k:'apagar',rot:'A receber'};
    if(r+0.005<(+j.valor||0)) return {k:'apagar',rot:'Parcial'};
    return {k:'pago',rot:'Recebido'};
  }
  function mesesDoAno(ano){
    var out=[]; for(var i=1;i<=12;i++) out.push(ano+'-'+String(i).padStart(2,'0')); return out;
  }

  function barras(valores, rotulos, destaque){
    var max=Math.max.apply(null,valores.concat([1]));
    var h='<div class="barras">';
    valores.forEach(function(v,i){
      var alt=v>0?Math.max(Math.round(v/max*100),3):0;
      h+='<div class="barra-col"'+(v>0?' title="'+esc(rotulos[i])+': '+moneyExib(v)+'"':'')+'>';
      h+='<div class="barra-topo">'+(v>0?'<span class="barra-val">'+(v>=1000?(Math.round(v/100)/10).toLocaleString('pt-BR')+'k':Math.round(v))+'</span>':'')+'</div>';
      h+='<div class="barra-trilho"><div class="barra-fill'+(destaque===i?' alto':'')+'" style="height:'+alt+'%"></div></div>';
      h+='<div class="barra-rot">'+esc(rotulos[i])+'</div></div>';
    });
    return h+'</div>';
  }

    var recMes=doMes.reduce(function(a,j){return a+recebidoJob(j);},0);

    h+='</section>';

    h+='<section><div class="sec-head"><h2>Jobs de '+esc(nomeMesCurto(mesId))+'</h2><span class="sec-total">'+moneyExib(abertoMes)+' em aberto</span></div>';

    h+='<button class="addbtn" data-act="add-job">Adicionar job</button></div>';

    if(doMes.length){

      });

    }

    var lista=filtroTipo==='todos'?doMes:doMes.filter(function(j){return tipoJob(j)===filtroTipo;});

      h+='<div class="vazio">Nenhum job neste mês.</div>';
    }else if(!lista.length){

    }else{
      var ordemTipo={recorrente:0,avulso:1,freela:2};
      lista=lista.slice().sort(function(a,b){
        return (ordemTipo[tipoJob(a)]-ordemTipo[tipoJob(b)]) || (a.data||'').localeCompare(b.data||'') || a.cliente.localeCompare(b.cliente);
      });
      h+='<div class="tabela-scroll"><table class="jobs-table"><thead><tr><th>Data</th><th>Cliente / job</th><th class="r">Orçamento</th><th class="r">Recebido</th><th class="r">Falta receber</th><th class="c">Situação</th><th></th></tr></thead><tbody>';
      var totOrc=0,totRec=0,totFal=0;
      lista.forEach(function(j){
        var st=statusJob(j), ab=abertoJob(j);
        totOrc+=(+j.valor||0); totRec+=recebidoJob(j); totFal+=ab;
        h+='<tr class="lin-'+tipoJob(j)+'"><td class="dim val">'+esc(dataCurta(j.data||j.mes+'-01'))+'</td>';
        h+='<td><span class="nome">'+esc(j.cliente)+'</span><br><span class="dim">'+esc(rotTipo(tipoJob(j)))+'</span></td>';
        h+='<td class="r"><input class="inline-val" style="font-weight:600" data-jedit="valor" data-id="'+j.id+'" value="'+money(j.valor)+'"></td>';
        h+='<td class="r"><input class="inline-val" style="color:var(--green);font-weight:600" data-jedit="recebido" data-id="'+j.id+'" value="'+(j.recebido?money(j.recebido):'')+'" placeholder="R$ 0,00"></td>';
        h+='<td class="r val" style="color:var(--azul);font-weight:600">'+moneyExib(ab)+'</td>';
        h+='<td class="c"><span class="chip '+st.k+'">'+st.rot+'</span></td>';
        h+='<td class="r" style="width:34px"><button class="del" data-del="job" data-id="'+j.id+'" aria-label="Remover">×</button></td></tr>';
      });
      h+='</tbody><tfoot><tr class="linha-total" style="border-top:1.5px solid var(--ink)">';
      h+='<td></td><td class="nome" style="font-weight:700">Total</td>';
      h+='<td class="r val" style="font-weight:700">'+moneyExib(totOrc)+'</td>';
      h+='<td class="r val" style="font-weight:700;color:var(--green)">'+moneyExib(totRec)+'</td>';
      h+='<td class="r val" style="font-weight:700;color:var(--azul)">'+moneyExib(totFal)+'</td>';
      h+='<td></td><td></td></tr></tfoot>';
      h+='</table></div>';
      h+='<div class="sec-note">Preencha “Recebido” conforme o cliente for pagando — não precisa ser tudo de uma vez, o valor fica somado até completar o orçamento.</div>';
    }
    h+='</section>';
    return h;
  }

  // ---------- financiamentos ----------
  function pagasFin(f){ return Math.min(Math.max(+f.pagas||0,0),+f.total||0); }
  function faltamFin(f){ return Math.max((+f.total||0)-pagasFin(f),0); }
  function restaFin(f){ return faltamFin(f)*(+f.valor||0); }
  function terminoFin(f){
    var n=faltamFin(f); if(!n) return 'quitado';
    var d=new Date(), m=d.getMonth()+n, y=d.getFullYear()+Math.floor(m/12);
    return MESES[m%12]+' de '+y;
  }

  function viewFinanc(){
    var totResta=financ.reduce(function(a,f){return a+restaFin(f);},0);
    var totMes=financ.reduce(function(a,f){return a+(faltamFin(f)?(+f.valor||0):0);},0);
    var h='';
    h+='<div class="topbar"><div class="mesnav"><h1 style="min-width:auto">Financiamentos</h1></div></div>';
    h+='<div class="hero"><div class="hero-label">Ainda falta pagar</div>';
    h+='<div class="hero-num">'+moneyExib(totResta)+'</div>';
    h+='<div class="hero-sub">'+(financ.length?'Soma das parcelas que ainda não venceram, em todos os financiamentos ativos.':'Cadastre as parcelas do carro para acompanhar quanto falta e quando acaba.')+'</div>';
    if(financ.length){
      h+='<div class="hero-grid"><div class="hero-cell"><span>Peso por mês</span><b>'+moneyExib(totMes)+'</b></div>';
      h+='<div class="hero-cell"><span>Contratos ativos</span><b>'+financ.filter(function(f){return faltamFin(f)>0;}).length+'</b></div></div>';
    }
    h+='</div>';

    h+='<section style="margin-top:28px"><div class="sec-head"><h2>Contratos</h2><span class="sec-total">'+moneyExib(totResta)+'</span></div>';
    h+='<div class="adder">';
    h+='<div class="field"><label for="nfi-nome">O que é</label><input id="nfi-nome" style="width:180px" placeholder="Parcela do Creta"></div>';
    h+='<div class="field"><label for="nfi-val">Parcela</label><input id="nfi-val" class="w-val" placeholder="R$ 0,00"></div>';
    h+='<div class="field-row"><div class="field"><label for="nfi-tot">Total</label><input id="nfi-tot" style="width:70px;text-align:center" placeholder="48"></div>';
    h+='<div class="field"><label for="nfi-pag">Já pagas</label><input id="nfi-pag" style="width:70px;text-align:center" placeholder="12"></div></div>';
    h+='<button class="addbtn" data-act="add-financ">Adicionar</button></div>';

    if(!financ.length){
      h+='<div class="vazio">Nenhum financiamento cadastrado.</div>';
    }else{
      financ.forEach(function(f){
        var pg=pagasFin(f), ft=faltamFin(f), pct=(+f.total?Math.round(pg/(+f.total)*100):0);
        h+='<div class="conta-bloco"><div class="conta-top"><b>'+esc(f.nome)+'</b><span class="val">'+moneyExib(restaFin(f))+'</span></div>';
        h+='<div class="conta-body" style="padding:12px 14px 14px">';
        h+='<div class="progresso"><div class="progresso-fill" style="width:'+pct+'%"></div></div>';
        h+='<div class="fin-linha"><span>'+pg+' de '+(+f.total||0)+' parcelas pagas</span><span>'+(ft?ft+(ft===1?' parcela restante':' parcelas restantes'):'quitado')+'</span></div>';
        h+='<div class="fin-linha"><span>Parcela de '+moneyExib(f.valor)+'</span><span>'+(ft?'Termina em '+terminoFin(f):'Contrato encerrado')+'</span></div>';
        h+='<div class="adder" style="border-top:1px solid var(--rule-soft);margin-top:10px;padding-top:12px">';
        h+='<button class="ghost" data-act="pagar-parcela" data-id="'+f.id+'"'+(ft?'':' disabled')+'>Marcar mais uma paga</button>';
        h+='<button class="ghost" data-act="desfazer-parcela" data-id="'+f.id+'"'+(pg?'':' disabled')+'>Desfazer</button>';
        h+='<button class="del" data-del="financ" data-id="'+f.id+'" aria-label="Remover" style="margin-left:auto">×</button>';
        h+='</div></div></div>';
      });
      h+='<div class="sec-note">Este painel é só o acompanhamento do contrato. A parcela do mês continua sendo contada uma única vez, em contas fixas — aqui ela não entra de novo nas despesas.</div>';
    }
    h+='</section>';
    return h;
  }

  // ---------- investimentos ----------
  var ROT_TIPO_INVEST={selic:'Tesouro Selic',txpre:'Tesouro Prefixado',cdb:'CDB',cdi:'CDI',acao:'Ações'};
  var CHIP_TIPO_INVEST={selic:'inv-selic',txpre:'inv-selic',cdb:'inv-cdb',cdi:'inv-cdi',acao:'inv-acao'};
  function ehRendaFixaInv(i){ return i.tipo==='selic'||i.tipo==='txpre'||i.tipo==='cdb'||i.tipo==='cdi'; }
  function ehPrefixado(inv){ return inv.tipo==='txpre'||(inv.tipo==='cdb'&&inv.rentabilidade==='pre'); }
  function serieDoInvest(inv){ return inv.tipo==='selic' ? mercado.selic : mercado.cdi; }
  function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function diasEntre(d1,d2){ return Math.round((new Date(d2+'T00:00:00')-new Date(d1+'T00:00:00'))/86400000); }
  function fimDoMesISO(mesId2){ var p=mesId2.split('-'),y=+p[0],m=+p[1]; var ultimo=new Date(y,m,0).getDate(); return mesId2+'-'+String(ultimo).padStart(2,'0'); }
  function diasParaVencimento(venc){
    if(!venc) return null;
    var hoje=new Date(); hoje.setHours(0,0,0,0);
    var v=new Date(venc+'T00:00:00');
    return Math.round((v-hoje)/86400000);
  }

  // histórico mês a mês de um prefixado — não depende de dado de mercado
  // nenhum, compõe a taxa anual contratada dia a dia (dias corridos, igual
  // o Tesouro Direto/corretora fazem), não por mês-calendário fechado
  function historicoPrefixado(inv){
    var dataIni=inv.data; if(!dataIni) return [];
    var hoje=hojeISO();
    if(dataIni>=hoje) return [];
    var taxaDia=Math.pow(1+(+inv.taxaPrefixada||0)/100,1/365)-1;
    var base=+inv.valorAplicado||0, out=[], mes=dataIni.slice(0,7), valorAnterior=base;
    while(mes<=hoje.slice(0,7)){
      var fimMes=fimDoMesISO(mes);
      var corte=fimMes<hoje?fimMes:hoje;
      var dias=diasEntre(dataIni,corte);
      var valorAcum=base*Math.pow(1+taxaDia,dias);
      out.push({mes:mes, rendimento:valorAcum-valorAnterior, acumulado:valorAcum});
      valorAnterior=valorAcum;
      mes=proxId(mes);
    }
    return out;
  }
  // taxa mensal efetiva pós-fixada: Tesouro Selic usa spread ADITIVO
  // (ex.: "Selic + 0,073% a.a.", como o próprio Tesouro Direto contrata);
  // CDI/CDB pós-fixado usa percentual MULTIPLICATIVO (ex.: "100% do CDI"),
  // que é como o mercado de CDB de fato cota.
  function taxaMensalEfetiva(inv, taxaIndexadorMes){
    if(inv.tipo==='selic'){
      var spreadMes=Math.pow(1+(+inv.spreadSelic||0)/100,1/12)-1;
      return (taxaIndexadorMes/100)+spreadMes;
    }
    return (taxaIndexadorMes/100)*((+inv.percIndexador||100)/100);
  }
  // histórico mês a mês de um pós-fixado, aplicando a taxa acumulada
  // (CDI ou Selic) do Banco Central mais o spread ou vezes o percentual
  // contratado, conforme o tipo
  function historicoPosFixado(inv){
    var serie=serieDoInvest(inv);
    if(!serie||!serie.length) return [];
    var mesIni=(inv.data||'').slice(0,7), valor=+inv.valorAplicado||0, out=[];
    serie.forEach(function(p){
      if(p.mes<mesIni) return;
      var rend=valor*taxaMensalEfetiva(inv,p.taxa);
      valor+=rend;
      out.push({mes:p.mes, rendimento:rend, acumulado:valor});
    });
    return out;
  }
  function historicoInvest(inv){ return ehPrefixado(inv)?historicoPrefixado(inv):historicoPosFixado(inv); }

  // acha, na lista de títulos do Tesouro Direto trazida por "Atualizar
  // cotações", o título que corresponde a este investimento — casando
  // por vencimento (data exata) e por tipo (Selic x Prefixado)
  function tituloCorresponde(t,inv){
    if(!t||!inv.vencimento||t.vencimento!==inv.vencimento) return false;
    var n=(t.nome||'').toLowerCase();
    if(inv.tipo==='selic') return n.indexOf('selic')>-1;
    if(inv.tipo==='txpre') return n.indexOf('prefixado')>-1 && n.indexOf('juros semestrais')===-1;
    return false;
  }
  function tituloDoInvest(inv){
    if(!mercado.tesouro||!mercado.tesouro.length) return null;
    for(var i=0;i<mercado.tesouro.length;i++){ if(tituloCorresponde(mercado.tesouro[i],inv)) return mercado.tesouro[i]; }
    return null;
  }
  // valor real de mercado (PU de resgate de hoje × quantidade de
  // títulos) — só existe se a pessoa informou a quantidade de títulos E
  // o Tesouro Direto ainda lista esse título hoje
  function valorAtualTesouroPU(inv){
    if(!inv.quantidadeTitulos) return null;
    var t=tituloDoInvest(inv);
    if(!t||typeof t.precoResgate!=='number') return null;
    return (+inv.quantidadeTitulos)*t.precoResgate;
  }

  // valor atual de um investimento de renda fixa — Tesouro Selic/Prefixado
  // usa o preço unitário real de resgate quando a quantidade de títulos
  // foi informada (marcação a mercado de verdade); senão cai pra
  // estimativa por taxa: prefixado usa a taxa contratada (sempre
  // disponível), pós-fixado depende da série do BCB já ter sido buscada
  function valorAtualRendaFixa(inv){
    if(inv.tipo==='selic'||inv.tipo==='txpre'){
      var pu=valorAtualTesouroPU(inv);
      if(pu!=null) return pu;
    }
    if(ehPrefixado(inv)){
      var histP=historicoPrefixado(inv);
      return histP.length?histP[histP.length-1].acumulado:(+inv.valorAplicado||0);
    }
    var serie=serieDoInvest(inv);
    if(!serie||!serie.length) return null;
    var hist=historicoPosFixado(inv);
    return hist.length?hist[hist.length-1].acumulado:(+inv.valorAplicado||0);
  }
  function valorAtualAcao(inv){
    var cot=mercado.acoes&&mercado.acoes[(inv.ticker||'').toUpperCase()];
    if(!cot) return null;
    return (+inv.quantidade||0)*cot.preco;
  }
  function valorAtualInvest(inv){ return inv.tipo==='acao'?valorAtualAcao(inv):valorAtualRendaFixa(inv); }
  function baseInvest(inv){ return inv.tipo==='acao'?(+inv.quantidade||0)*(+inv.precoMedio||0):(+inv.valorAplicado||0); }
  function rendimentoInvest(inv){
    var atual=valorAtualInvest(inv), base=baseInvest(inv);
    if(atual==null) return {valor:null,pct:null};
    return {valor:atual-base, pct:base?(atual/base-1)*100:0};
  }

  // tabela regressiva de IR sobre renda fixa (sobre o RENDIMENTO, não o
  // total): até 180 dias 22,5% · 181–360 dias 20% · 361–720 dias 17,5%
  // · acima de 720 dias 15%. Não inclui IOF (só pesa em resgates com
  // menos de 30 dias) nem a regra de isenção de ações (depende do total
  // vendido no mês, que este app não acompanha) — por isso ações entram
  // aqui pelo valor bruto mesmo.
  function aliquotaIR(dias){
    if(dias<=180) return 0.225;
    if(dias<=360) return 0.20;
    if(dias<=720) return 0.175;
    return 0.15;
  }
  function valorLiquidoInvest(inv){
    var atual=valorAtualInvest(inv);
    if(atual==null) atual=baseInvest(inv);
    if(inv.tipo==='acao') return atual;
    var base=baseInvest(inv), rend=atual-base;
    if(rend<=0) return atual;
    var dias=diasEntre(inv.data,hojeISO());
    if(isNaN(dias)||dias<0) dias=0;
    return atual-rend*aliquotaIR(dias);
  }

  // grupos pra organizar a carteira — Selic e Prefixado são os dois a
  // mesma "família" (Tesouro Direto), CDB e CDI são renda fixa privada
  var GRUPOS_INVEST=[
    {id:'tesouro', nome:'Tesouro Direto', tipos:['selic','txpre'], cor:'var(--azul)', corEsc:'var(--azul-esc)', corSuave:'#E7EFF9'},
    {id:'privada', nome:'Renda Fixa Privada', tipos:['cdb','cdi'], cor:'var(--violeta)', corEsc:'var(--violeta-esc)', corSuave:'#F1E9F8'},
    {id:'acoes', nome:'Ações', tipos:['acao'], cor:'var(--rose)', corEsc:'var(--rose-esc)', corSuave:'#F7E8EE'}
  ];
  function grupoDoInvest(inv){
    return GRUPOS_INVEST.filter(function(g){return g.tipos.indexOf(inv.tipo)>-1;})[0]||GRUPOS_INVEST[1];
  }

  // desenha um donut SVG a partir de fatias [{valor,cor,rotulo}] — sem
  // biblioteca externa, só path de arco; o <title> dá tooltip nativo ao
  // passar o mouse/dedo, então já é "dinâmico" sem precisar de JS extra
  function graficoPizza(fatias,tamanho){
    tamanho=tamanho||168;
    var total=fatias.reduce(function(a,f){return a+f.valor;},0);
    if(!total) return '';
    var raio=tamanho/2, cx=raio, cy=raio, raioInt=raio*0.62;
    var ang=-90;
    var svg='<svg viewBox="0 0 '+tamanho+' '+tamanho+'" width="'+tamanho+'" height="'+tamanho+'" style="display:block">';
    var positivas=fatias.filter(function(f){return f.valor>0;});
    if(positivas.length===1){
      // um arco de 360° tem início = fim e o SVG não desenha nada — vira um anel
      svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((raio+raioInt)/2)+'" fill="none" stroke="'+positivas[0].cor+'" stroke-width="'+(raio-raioInt)+'"><title>'+esc(positivas[0].rotulo)+': '+money(positivas[0].valor)+' (100%)</title></circle></svg>';
      return svg;
    }
    fatias.forEach(function(f){
      if(f.valor<=0) return;
      var fracao=f.valor/total;
      var angFim=ang+fracao*360;
      var largeArc=(angFim-ang)>180?1:0;
      var r=Math.PI/180;
      var x1=cx+raio*Math.cos(ang*r), y1=cy+raio*Math.sin(ang*r);
      var x2=cx+raio*Math.cos(angFim*r), y2=cy+raio*Math.sin(angFim*r);
      var xi1=cx+raioInt*Math.cos(angFim*r), yi1=cy+raioInt*Math.sin(angFim*r);
      var xi2=cx+raioInt*Math.cos(ang*r), yi2=cy+raioInt*Math.sin(ang*r);
      var d='M'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+raio+','+raio+' 0 '+largeArc+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+
            ' L'+xi1.toFixed(2)+','+yi1.toFixed(2)+' A'+raioInt+','+raioInt+' 0 '+largeArc+' 0 '+xi2.toFixed(2)+','+yi2.toFixed(2)+' Z';
      svg+='<path d="'+d+'" fill="'+f.cor+'"><title>'+esc(f.rotulo)+': '+money(f.valor)+' ('+(fracao*100).toFixed(1)+'%)</title></path>';
      ang=angFim;
    });
    svg+='</svg>';
    return svg;
  }

  function rendimentoMensalTotal(){
    var mapa={};
    investimentos.filter(ehRendaFixaInv).forEach(function(inv){
      historicoInvest(inv).forEach(function(h){ mapa[h.mes]=(mapa[h.mes]||0)+h.rendimento; });
    });
    return Object.keys(mapa).sort().map(function(m){ return {mes:m, rendimento:mapa[m]}; });
  }
  function nomeMesAno(mesId2){ var p=mesId2.split('-'); return MESES[+p[1]-1]+'/'+p[0].slice(2); }

  // taxa média mensal (%) da série, últimos N meses em cache — usada só
  // pra projeção simples dos pós-fixados
  function taxaMediaMensal(serie,n){
    if(!serie||!serie.length) return null;
    var ult=serie.slice(-n);
    if(!ult.length) return null;
    return ult.reduce(function(a,p){return a+p.taxa;},0)/ult.length;
  }
  function projecaoInvestRendaFixa(inv,mesesAFrente){
    var atual=valorAtualRendaFixa(inv); if(atual==null) atual=baseInvest(inv);
    if(ehPrefixado(inv)){
      var taxaMes=Math.pow(1+(+inv.taxaPrefixada||0)/100,1/12)-1;
      return atual*Math.pow(1+taxaMes,mesesAFrente);
    }
    var serieRef=inv.tipo==='selic'?mercado.selic:mercado.cdi;
    var taxaMedia=taxaMediaMensal(serieRef,6);
    if(taxaMedia==null) return atual;
    return atual*Math.pow(1+taxaMensalEfetiva(inv,taxaMedia),mesesAFrente);
  }
  function projecaoRendaFixa(mesesAFrente){
    var lista=investimentos.filter(ehRendaFixaInv);
    if(!lista.length) return null;
    return lista.reduce(function(a,inv){return a+projecaoInvestRendaFixa(inv,mesesAFrente);},0);
  }

  // Busca uma URL de mercado sem nunca lançar exceção — devolve
  // {error: '...'} em vez de rejeitar, pra uma fonte falhando não
  // esconder o resultado nem o erro das outras.
  async function buscarMercado(url){
    var r;
    try{ r=await fetch(url); }catch(e){ return {error:'falha de rede'}; }
    var data=null;
    try{ data=await r.json(); }catch(e){ return {error:'resposta inválida do servidor (HTTP '+r.status+')'}; }
    if(!r.ok) return {error:(data&&data.error)||('HTTP '+r.status)};
    return data;
  }

  async function atualizarMercado(){
    if(atualizandoMercado) return;
    atualizandoMercado=true;
    try{
      var rf=investimentos.filter(function(i){return ehRendaFixaInv(i)&&!ehPrefixado(i);});
      var minData=rf.reduce(function(m,i){return (!m||i.data<m)?i.data:m;},null);
      var acoes=investimentos.filter(function(i){return i.tipo==='acao'&&i.ticker;});
      var tickers=Array.from(new Set(acoes.map(function(i){return i.ticker.toUpperCase();})));
      var temTesouro=investimentos.some(function(i){return i.tipo==='selic'||i.tipo==='txpre';});

      var chamadas=[
        {nome:'CDI', chave:'cdi', url:'/api/market-data?tipo=cdi'+(minData?'&desde='+minData:'')},
        {nome:'Selic', chave:'selic', url:'/api/market-data?tipo=selic'+(minData?'&desde='+minData:'')}
      ];
      if(tickers.length) chamadas.push({nome:'Ações', chave:'acao', url:'/api/market-data?tipo=acao&ticker='+encodeURIComponent(tickers.join(','))});
      if(temTesouro) chamadas.push({nome:'Tesouro Direto', chave:'tesouro', url:'/api/market-data?tipo=tesouro'});

      var resultados=await Promise.all(chamadas.map(function(c){ return buscarMercado(c.url); }));
      var porChave={};
      var falhas=[];
      chamadas.forEach(function(c,i){ porChave[c.chave]=resultados[i]; if(resultados[i].error) falhas.push(c.nome+': '+resultados[i].error); });

      mercado={
        cdi: (porChave.cdi&&porChave.cdi.serie)||mercado.cdi,
        selic: (porChave.selic&&porChave.selic.serie)||mercado.selic,
        acoes: Object.assign({},mercado.acoes,(porChave.acao&&porChave.acao.cotacoes)||{}),
        tesouro: (porChave.tesouro&&porChave.tesouro.titulos)||mercado.tesouro,
        atualizadoEm: new Date().toISOString()
      };
      await sset(KEY_MERCADO,mercado);
      toast(falhas.length?('Atualizado com avisos — '+falhas.join(' · ')):'Cotações atualizadas.');
    }catch(e){
      toast('Não consegui atualizar as cotações agora. Tente de novo em instantes.');
    }
    atualizandoMercado=false; render();
  }

  function categoriaTotais(m){
    var mapa={};
    m.fixas.forEach(function(f){ mapa[f.categoria]=(mapa[f.categoria]||0)+(+f.valor||0); });
    m.lancamentos.forEach(function(l){ mapa[l.categoria]=(mapa[l.categoria]||0)+(+l.valor||0); });
    return mapa;
  }

  function toast(msg){

  async function salvar(){ await sset(keyMes(mesId),mes); }

  async function irPara(id){
    var m=await sget(keyMes(id));
    if(!m){
      var ant=await sget(keyMes(antId(id)));
      m=mesNovo(id,cfg);
      if(ant&&ant.destino&&+ant.destino.repassar) m.repasse=+ant.destino.repassar;
      await sset(keyMes(id),m);
      meses=await carregarMeses();
    }
    mesId=id; mes=m; filtroCat='todas'; imp={carregando:false,erro:null,itens:null,conta:imp.conta};
    await garantirDraHeloisa();
    render(); window.scrollTo({top:0});
  }
  async function carregarMeses(){
    var ks=await slist('fin:mes:');
    return ks.map(function(k){return k.replace('fin:mes:','');}).sort();
  }

  function exportarJobs(){
    var L=[['Mês','Data','Cliente/Job','Tipo','Orçamento','Recebido','Falta receber','Situação']];
    jobsDoMes(mesId).slice().sort(function(a,b){return (a.data||'').localeCompare(b.data||'');}).forEach(function(j){
      var st=statusJob(j);
      L.push([mesId,j.data||'',j.cliente,rotTipo(tipoJob(j)),(+j.valor||0).toFixed(2),recebidoJob(j).toFixed(2),abertoJob(j).toFixed(2),st.rot]);
    });
    var csv='\ufeff'+L.map(function(l){return l.map(celulaCSV).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='faturamento-'+mesId+'.csv'; a.click();
    toast('Faturamento de '+nomeMesCurto(mesId)+' baixado.');
  }

  async function exportarBackup(){
    var keys=await slist('fin:');
    var bundle={};
    for(var i=0;i<keys.length;i++){
      try{ var r=await window.storage.get(keys[i]); bundle[keys[i]]=r.value; }catch(e){}
    }
    var blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='backup-financas-'+hojeId()+'.json'; a.click();
    toast('Backup baixado — '+keys.length+' itens.');
  }

  async function importarBackup(file){
    try{
      var texto=await file.text();
      var bundle=JSON.parse(texto);
      var chaves=Object.keys(bundle).filter(function(k){ return k.indexOf('fin:')===0 && typeof bundle[k]==='string'; });
      if(!chaves.length){ toast('Esse arquivo não parece um backup deste app.'); return; }
      for(var i=0;i<chaves.length;i++){ await window.storage.set(chaves[i],bundle[chaves[i]]); }
      toast('Backup importado — '+chaves.length+' itens. Recarregando…');
      setTimeout(function(){ location.reload(); },1200);
    }catch(e){
      toast('Não consegui ler esse arquivo de backup.');
    }
  }

  function exportarCSV(){
    var L=[['Mês','Tipo','Item','Categoria','Data/Dia','Pago com','Valor','Situação']];
    var jm=jobsDoMes(mesId);
    if(jm.length) L.push([mesId,'Entrada','Jobs de '+nomeMesCurto(mesId)+' ('+jm.length+')','','','',totJobsMes(mesId).toFixed(2),'']);
    if(+mes.repasse) L.push([mesId,'Entrada','Sobra de '+nomeMesCurto(antId(mesId)),'','','',(+mes.repasse).toFixed(2),'']);
    mes.entradas.forEach(function(e){ L.push([mesId,'Entrada',e.nome,'','','',(+e.valor||0).toFixed(2),'']); });
    mes.fixas.forEach(function(f){ L.push([mesId,'Conta fixa',f.nome,f.categoria,'dia '+f.dia,'',(+f.valor||0).toFixed(2),f.pago?'Pago':'A pagar']); });
    mes.lancamentos.forEach(function(l){ L.push([mesId,'Gasto',l.descricao,l.categoria,l.data||'',nomeConta(l.conta),(+l.valor||0).toFixed(2),'']); });
    L.push([mesId,'Resumo','Total de entradas','','','',totEntradas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Total de saídas','','','',totDespesas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Sobra','','','',sobra(mes).toFixed(2),'']);
    var csv='\ufeff'+L.map(function(l){return l.map(celulaCSV).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='financas-'+mesId+'.csv'; a.click();
    toast('CSV de '+nomeMesCurto(mesId)+' baixado.');
  }

      await salvar();
      if(pc) await propagarParcelas({data:dataC,categoria:catC,valor:vlC,conta:contaC,descricao:descC},pc);
      render(); return;

    if(act==='ler-texto'){

        mes.lancamentos.push({id:uid(),data:i.data,descricao:i.descricao,categoria:i.categoria,valor:i.valor,conta:imp.conta,parcelado:!!i.parcelado});
        if(i.parcelado){
          var pc=detectaParcela(i.descricao);
          if(pc) paraPropagar.push({lanc:{data:i.data,descricao:i.descricao,categoria:i.categoria,valor:i.valor,conta:imp.conta},pc:pc});
        }
      });
      imp.itens=null; imp.erro=null;
      await salvar();
      for(var pi=0;pi<paraPropagar.length;pi++){ await propagarParcelas(paraPropagar[pi].lanc,paraPropagar[pi].pc); }
      render();

    if(act==='add-job'){

          cur=proxId(cur); n++;

      jobs.push({id:uid(),cliente:cli,tipo:tj,mes:mj,data:dj,valor:vj,recebido:0});
      await sset(KEY_JOBS,jobs); render(); return;

    if(act==='add-financ'){

    if(act==='pagar-parcela'||act==='desfazer-parcela'){
      var ff=financ.filter(function(x){return x.id===t.dataset.id;})[0];
      if(ff){
        ff.pagas=act==='pagar-parcela'?Math.min((+ff.pagas||0)+1,+ff.total||0):Math.max((+ff.pagas||0)-1,0);
        await sset(KEY_FIN,financ); render();

    if(act==='add-invest'){

        var pm=parseNum(document.getElementById('nvi-pm').value);

        if(!nvn||!vvi){ toast('Preencha o nome e o valor aplicado.'); return; }
        novoInv.nome=nvn; novoInv.valorAplicado=vvi;
        if(tpi==='selic'||tpi==='txpre'){
          var qtit=parseNum(document.getElementById('nvi-qtdtit').value);
          if(qtit) novoInv.quantidadeTitulos=qtit;
        }
        novoInv.instituicao=document.getElementById('nvi-instituicao').value.trim();
        novoInv.vencimento=document.getElementById('nvi-venc').value||'';
        novoInv.liquidez=document.getElementById('nvi-liquidez').value;
        if(((tpi==='cdb')&&document.getElementById('nvi-rent').value==='pre')||tpi==='txpre'){
          var txp=parseNum(document.getElementById('nvi-taxa').value);
          if(!txp){ toast('Preencha a taxa contratada ao ano.'); return; }
          novoInv.rentabilidade='pre'; novoInv.taxaPrefixada=txp;
        }else if(tpi==='selic'){
          novoInv.spreadSelic=parseNum(document.getElementById('nvi-spread').value)||0;
        }else{
          novoInv.rentabilidade='pos'; novoInv.percIndexador=parseNum(document.getElementById('nvi-perc').value)||100;
        }
      }
      investimentos.push(novoInv);
      await sset(KEY_INVEST,investimentos); render();
      atualizarMercado(); return;
    }
    if(act==='atualizar-mercado'){ await atualizarMercado(); return; }
    if(act==='export-jobs'){ exportarJobs(); return; }
    if(act==='export-backup'){ menuAberto=false; await exportarBackup(); render(); return; }
    if(act==='import-backup'){ menuAberto=false; render(); document.getElementById('arqBackup').click(); return; }
    if(act==='export'){ menuAberto=false; exportarCSV(); render(); return; }
    if(act==='reset'){
      if(!confirm('Isso apaga tudo e volta para agosto vazio, só com a lista de contas fixas. Continuar?')) return;
      menuAberto=false;
      for(var k=0;k<meses.length;k++){ try{ await window.storage.delete(keyMes(meses[k])); }catch(e){} }
      try{ await window.storage.delete(KEY_CFG); }catch(e){}
      await iniciar(true); return;
    }
    if(act==='sair'){ menuAberto=false; await window.__sairApp(); return; }

        else jx.valor=Math.abs(parseNum(el.value));

      }
      return;
    }
    if(el.dataset.edit){
      var v=parseNum(el.value),id=el.dataset.id,tp=el.dataset.edit,alvo=null;
      if(tp==='entrada') alvo=mes.entradas.filter(function(x){return x.id===id;})[0];
      if(tp==='fixa') alvo=mes.fixas.filter(function(x){return x.id===id;})[0];
      if(tp==='lanc') alvo=mes.lancamentos.filter(function(x){return x.id===id;})[0];
      if(alvo){
        alvo.valor=v;
        if(alvo.refId&&(tp==='fixa'||tp==='entrada')){
          var lista=tp==='fixa'?cfg.contasFixas:cfg.entradasFixas;
          var tpl=lista.filter(function(x){return x.id===alvo.refId;})[0];
          if(tpl){ tpl.valor=v; await sset(KEY_CFG,cfg); }
        }
        await salvar(); render();
      }
      return;
    }
    if(el.dataset.catedit){
      var idc=el.dataset.id,tpc=el.dataset.catedit,alvoc=null;
      if(tpc==='fixa') alvoc=mes.fixas.filter(function(x){return x.id===idc;})[0];
      if(tpc==='lanc') alvoc=mes.lancamentos.filter(function(x){return x.id===idc;})[0];
      if(alvoc){
        alvoc.categoria=el.value;
        if(tpc==='fixa'&&alvoc.refId){
          var tplc=cfg.contasFixas.filter(function(x){return x.id===alvoc.refId;})[0];
          if(tplc){ tplc.categoria=el.value; await sset(KEY_CFG,cfg); }
        }
        await salvar(); render();
      }
      return;
    }
  });

  async function garantirDraHeloisa(){
    var ja=mes.entradas.some(function(e){ return /helo[ií]sa/i.test(e.nome||''); });
    if(ja) return;
    var tpl=cfg.entradasFixas.filter(function(e){return /helo[ií]sa/i.test(e.nome||'');})[0];
    var rid;
    if(tpl){ rid=tpl.id; }
    else{ rid='e'+uid(); cfg.entradasFixas.push({id:rid,nome:'Dra. Heloísa',valor:5500}); await sset(KEY_CFG,cfg); }
    mes.entradas.push({id:uid(),refId:rid,nome:'Dra. Heloísa',valor:5500});
    await salvar();
  }

  async function corrigirMarco(){
    var flag=await sget('fin:jobs_fix_mar');
    if(flag) return;
    var alvo=jobs.filter(function(j){return j.grupo==='seed-total'&&j.mes==='2026-03';})[0];
    if(alvo){ alvo.valor=15000; await sset(KEY_JOBS,jobs); }
    await sset('fin:jobs_fix_mar',true);
  }
  // versão antiga guardava tudo em localStorage; se ainda houver dados
  // aqui neste navegador e o servidor estiver vazio, migra pra API uma
  // única vez em vez de simplesmente semear do zero.
  async function migrarLocalParaServidor(){
    var chaves=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf('fin:')===0) chaves.push(k);
      }
    }catch(e){ return false; }
    if(!chaves.length) return false;
    for(var j=0;j<chaves.length;j++){
      await window.storage.set(chaves[j],localStorage.getItem(chaves[j]));
    }
    chaves.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    return true;
  }

  async function iniciar(forcar){
    cfg=forcar?null:await sget(KEY_CFG);
    if(cfg&&cfg.versao!==VERSAO) cfg=null;
    if(!cfg&&!forcar){
      var migrou=await migrarLocalParaServidor();
      if(migrou){ cfg=await sget(KEY_CFG); if(cfg&&cfg.versao!==VERSAO) cfg=null; }
    }
    if(!cfg){
      var antigos=await slist('fin:mes:');
      for(var j=0;j<antigos.length;j++){ try{ await window.storage.delete(antigos[j]); }catch(e){} }
      cfg=cfgSemente();
      await sset(KEY_CFG,cfg);
      await sset(keyMes('2026-08'),mesNovo('2026-08',cfg));
    }
    meses=await carregarMeses();
    jobs=await sget(KEY_JOBS)||[];
    await corrigirSeedJobs();
    await corrigirMarco();
    financ=await sget(KEY_FIN)||[];
    investimentos=await sget(KEY_INVEST)||[];
    mercado=await sget(KEY_MERCADO)||{};
    mercado={cdi:mercado.cdi||[],selic:mercado.selic||[],acoes:mercado.acoes||{},tesouro:mercado.tesouro||[],atualizadoEm:mercado.atualizadoEm||null};
    if(!meses.length){ await sset(keyMes('2026-08'),mesNovo('2026-08',cfg)); meses=['2026-08']; }
    var alvo=meses.indexOf(hojeId())>-1?hojeId():meses[meses.length-1];
    mesId=alvo; mes=await sget(keyMes(alvo))||mesNovo(alvo,cfg);
    imp.conta=cfg.contas[0].id;
    await garantirDraHeloisa();
    render();
  }

  function erroBoot(e){
    if(e&&e.unauthorized) return;
    document.getElementById('app').innerHTML='<div class="wrap"><p class="boot">Não consegui abrir o armazenamento. Recarregue a página para tentar de novo.</p></div>';
  }

  var usuarioLogado=null;

  function telaLogin(msgErro){
    document.getElementById('app').innerHTML=
      '<div class="login-screen">'+
        '<div class="login-card">'+
          '<h1>Financeiro 2026</h1>'+
          '<p class="login-subtitle">Entre com seu usuário abaixo para acessar seu controle financeiro</p>'+
          (msgErro?'<div class="erro login-error">'+esc(msgErro)+'</div>':'')+
          '<div class="login-field">'+
            '<label for="login-usuario">Usuário</label>'+
            '<input type="text" id="login-usuario" placeholder="Seu usuário" autocapitalize="off" autocorrect="off" autocomplete="username">'+
          '</div>'+
          '<div class="login-field login-password">'+
            '<label for="login-senha">Senha</label>'+
            '<input type="password" id="login-senha" placeholder="Sua senha" autocomplete="current-password">'+
          '</div>'+
          '<label class="login-lembrar"><input type="checkbox" id="login-lembrar"> Lembrar de mim</label>'+
          '<button class="login-btn" id="login-btn">Entrar</button>'+
        '</div>'+
      '</div>';
    var campoUsuario=document.getElementById('login-usuario');
    var campoSenha=document.getElementById('login-senha');
    campoUsuario.focus();
    campoUsuario.addEventListener('keydown',function(e){ if(e.key==='Enter') campoSenha.focus(); });
    campoSenha.addEventListener('keydown',function(e){ if(e.key==='Enter') tentarLogin(); });
    document.getElementById('login-btn').addEventListener('click',tentarLogin);
  }

  async function tentarLogin(){
    var usuario=document.getElementById('login-usuario').value.trim();
    var senha=document.getElementById('login-senha').value;
    var lembrar=!!(document.getElementById('login-lembrar')&&document.getElementById('login-lembrar').checked);
    var btn=document.getElementById('login-btn');
    if(!usuario||!senha){ telaLogin('Preencha usuário e senha.'); return; }
    if(btn){ btn.disabled=true; btn.textContent='Entrando…'; }
    try{
      var resp=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:usuario,senha:senha,lembrar:lembrar})});
      var data=await resp.json().catch(function(){ return {}; });
      if(resp.ok){ usuarioLogado=data.usuario||usuario; iniciar(false).catch(erroBoot); }
      else{ telaLogin(data.error||'Usuário ou senha incorretos.'); }
    }catch(e){
      telaLogin('Não consegui falar com o servidor. Tente de novo.');
    }
  }

  async function sair(){
    try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
    location.reload();
  }
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason;
    ev.preventDefault();
    if(r&&r.unauthorized) return;
    toast('Sem conexão com o servidor. Nada foi apagado — tente de novo.');
  });
  window.__sairApp=sair;
  window.__usuarioLogado=function(){ return usuarioLogado; };
  window.__onUnauthorized=function(){ telaLogin(); };

  (async function(){
    try{
      var resp=await fetch('/api/session');
      var data=await resp.json().catch(function(){ return {}; });
      if(resp.ok){ usuarioLogado=data.usuario||null; await iniciar(false); }
      else telaLogin();
    }catch(e){ erroBoot(e); }
  })().catch(erroBoot);
})();
</script>
