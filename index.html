<html lang="pt-BR">
<head>
<meta charset="utf-8">

<body>

  <div id="boot" class="boot">Abrindo seu controle…</div>

<style>
  :root{
    --paper:#F2F3EE;
    --ink:#1B2A2E;
    --muted:#5E6B6B;
    --rule:#D8DBD3;
    --rule-soft:#E7E9E3;
    --green:#2E6B4E;
    --red:#9A3B2C;
    --amber:#8C6712;
    --azul:#2A5FA8;
    --azul-esc:#1E3F70;
    --violeta:#7A4FB0;
    --violeta-esc:#4F3178;
    --indigo:#35528F;
    --indigo-esc:#233A66;
    --rose:#A8496B;
    --rose-esc:#722F49;
    --ambron:#8C6712;
    --ambron-esc:#5E430C;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  #app *{box-sizing:border-box}
  #app{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.45;padding:0 0 64px}
  #app button{font-family:inherit;font-size:inherit;cursor:pointer}
  #app input,#app select,#app textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
  .num,.val{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .boot{padding:48px 20px;color:var(--muted)}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 14px}
  .mesnav{display:flex;align-items:center;gap:6px}
  .mesnav h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;min-width:170px;text-align:center}
  .arrow{border:1px solid var(--rule);background:transparent;color:var(--ink);width:30px;height:30px;border-radius:50%;line-height:1;display:grid;place-items:center}
  .arrow:hover{background:#E4E7DF}
  .arrow:disabled{opacity:.3;cursor:default}
  .toolbtn{border:1px solid var(--rule);background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px}
  .toolbtn:hover{color:var(--ink);background:#E4E7DF}
  .tools{display:flex;gap:6px;flex-wrap:wrap}

  .hero{background:var(--ink);color:var(--paper);border-radius:3px;padding:26px 24px 22px;margin-bottom:8px}
  .hero.hero-jobs{background:linear-gradient(155deg,var(--indigo-esc),var(--indigo))}
  .hero.hero-cartoes{background:linear-gradient(155deg,var(--rose-esc),var(--rose))}
  .hero.hero-financ{background:linear-gradient(155deg,var(--ambron-esc),#B4870F)}
  .hero-label{font-size:13px;color:rgba(242,243,238,.68);margin-bottom:2px}
  .hero-num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:54px;line-height:1.02;font-weight:600;letter-spacing:-0.02em}
  .hero-num.neg{color:#F2C4B4}
  .hero-sub{font-size:13px;color:rgba(242,243,238,.68);margin-top:8px;max-width:54ch}
  .hero-grid{display:flex;flex-wrap:wrap;gap:0 34px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(242,243,238,.16)}
  .hero-cell span{display:block;font-size:12px;color:rgba(242,243,238,.68)}
  .hero-cell b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}

  .destino{border:1px solid var(--rule);border-radius:3px;padding:14px 16px;margin-bottom:30px;background:#F8F9F5}
  .destino h3{margin:0 0 2px;font-size:14px;font-weight:600}
  .destino p{margin:0 0 12px;font-size:13px;color:var(--muted);max-width:62ch}
  .dest-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select{border:1px solid var(--rule);background:#fff;border-radius:2px;padding:6px 8px;height:33px}
  .field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .w-val{width:128px;text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}
  .livre{font-size:13px;color:var(--muted);padding-bottom:8px}
  .livre b{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}

  section{margin-bottom:34px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
  .sec-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
  .sec-total{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .sec-note{font-size:12.5px;color:var(--muted);padding:7px 0 0;max-width:70ch}

  table{width:100%;border-collapse:collapse}
  th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 8px 6px;border-bottom:1px solid var(--rule-soft)}
  td{padding:7px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  th:first-child,td:first-child{padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  .r{text-align:right}.c{text-align:center}
  .nome{font-weight:500}
  .ib-filmes{text-transform:uppercase;font-weight:700;letter-spacing:.01em}
  .dim{color:var(--muted);font-size:13px}

  .chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .chip.pago{border-color:#BFD6C8;background:#E7F1EA;color:var(--green)}
  .chip.apagar{border-color:#E0D2AE;background:#F6EFDC;color:var(--amber)}
  .chip.vencido{border-color:#E2BDB4;background:#F6E5E1;color:var(--red)}
  .chip.parcela{border-color:#D8C3EC;background:#F1E9F8;color:var(--violeta-esc)}
  .chip.avulsa{border-color:#D8DBD3;background:#fff;color:var(--muted)}
  .venc.alerta{color:var(--red)}
  .venc{font-size:12px;color:var(--muted)}

  .inline-val{border:1px solid transparent;background:transparent;width:104px;text-align:right;padding:4px 6px;border-radius:2px;font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px}
  .inline-val:hover{border-color:var(--rule);background:#fff}
  .inline-val:focus{border-color:var(--ink);background:#fff;outline:none}
  .del{border:none;background:transparent;color:#AAB4B2;font-size:17px;line-height:1;padding:2px 4px;border-radius:3px}
  .del:hover{color:var(--red);background:#F6E5E1}

  .adder{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 0 2px;border-top:1px solid var(--rule-soft);margin-top:2px}
  .addbtn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px;padding:0 16px;height:33px}
  .addbtn:hover{background:#2A3E42}
  .addbtn:disabled{opacity:.5;cursor:default}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:0 14px;height:33px}
  .ghost:hover{background:#E4E7DF}
  .vazio{padding:16px 0;color:var(--muted);font-size:13.5px}

  /* importação por texto */
  .import{border:1px solid var(--rule);border-radius:3px;background:#F8F9F5;padding:16px;margin-bottom:6px}
  .import h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
  .import p{margin:0 0 13px;font-size:13px;color:var(--muted);max-width:66ch}
  .imp-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  textarea{width:100%;min-height:92px;border:1px solid var(--rule);border-radius:2px;padding:9px 10px;background:#fff;resize:vertical;font-size:14px;line-height:1.5}
  .lendo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:18px 0}
  .spin{width:15px;height:15px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:g .7s linear infinite}

  .revisar select{border:1px solid var(--rule);background:#fff;border-radius:2px;padding:3px 5px;height:29px;font-size:13px;max-width:130px}

  .rev-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px}
  .rev-info{font-size:13px;color:var(--muted)}

  .catdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;position:relative;top:-1px}

  .conta-bloco{border:1px solid var(--rule);border-radius:3px;margin-top:12px;overflow:hidden}
  .conta-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 14px;background:#EAEDE5;border-left:4px solid var(--rule)}
  .conta-top.c-azul{background:#E7EFF9;border-left-color:var(--azul)}
  .conta-top.c-ultravioleta{background:#F1E9F8;border-left-color:var(--violeta)}
  .conta-top b{font-size:14.5px}
  .conta-top .val{font-size:18px;font-weight:600}
  .conta-body{padding:2px 14px 6px}
  .conta-body table{font-size:14px}
  .conta-body h4{margin:12px 0 2px;font-size:12.5px;color:var(--muted);font-weight:600}
  .conta-body h4:first-child{margin-top:8px}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
  .fchip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:3px;font-size:13.5px;z-index:50;box-shadow:0 6px 20px rgba(27,42,46,.25)}
  .rodape{border-top:1px solid var(--rule);padding-top:14px;font-size:12.5px;color:var(--muted);max-width:68ch}

  .abas{display:flex;gap:2px;padding:18px 0 0;border-bottom:1px solid var(--rule);margin-bottom:2px}
  .aba{border:1px solid transparent;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:8px 15px;border-radius:3px 3px 0 0;font-size:14px;position:relative;top:1px}
  .aba:hover{color:var(--ink)}
  .aba[aria-pressed="true"]{color:var(--ink);font-weight:600}
  .aba[data-vista="mes"][aria-pressed="true"]{border-bottom-color:var(--ink)}
  .aba[data-vista="jobs"][aria-pressed="true"]{border-bottom-color:var(--indigo)}
  .aba[data-vista="cartoes"][aria-pressed="true"]{border-bottom-color:var(--rose)}
  .aba[data-vista="financ"][aria-pressed="true"]{border-bottom-color:var(--ambron)}

  .barras{display:flex;align-items:flex-end;gap:6px;height:190px;padding:12px 0 0}
  .barra-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .barra-topo{height:18px;text-align:center}
  .barra-val{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
  .barra-trilho{flex:1;display:flex;align-items:flex-end;background:#E7E9E3;border-radius:2px 2px 0 0}
  .barra-fill{width:100%;background:#8FA69C;border-radius:2px 2px 0 0}
  .barra-fill.alto{background:var(--ink)}
  .barra-rot{text-align:center;font-size:11.5px;color:var(--muted);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tipos{display:flex;gap:16px;flex-wrap:wrap;padding:14px 0 2px}
  .tipo-bloco{flex:1;min-width:180px}
  .tipo-rot{font-size:13px;color:var(--muted)}
  .tipo-val{font-size:21px;font-weight:600}
  .tipo-dim{font-size:12.5px;color:var(--muted)}
  select.mini{border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;padding:1px 3px;border-radius:2px;margin-top:2px}
  select.mini:hover{border-color:var(--rule);background:#fff;color:var(--ink)}
  .linkjob{border:none;background:transparent;color:var(--ink);font-weight:500;padding:0;text-align:left;border-bottom:1px solid var(--rule);font-size:15px}
  .linkjob:hover{border-bottom-color:var(--ink)}

  .lin-recorrente{background:#EEF1F8}
  .lin-avulso{background:#FBEEF1}
  .lin-freela{background:#FBF3E1}
  .lin-recorrente td,.lin-avulso td,.lin-freela td{border-bottom-color:rgba(0,0,0,.05)}
  .progresso{height:7px;background:#E7E9E3;border-radius:4px;overflow:hidden;margin-bottom:10px}
  .progresso-fill{height:100%;background:var(--ink)}
  .progresso-fill.c-indigo{background:var(--indigo)}
  .progresso-fill.c-amber{background:var(--ambron)}
  .fin-linha{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);padding:2px 0}
  .fin-linha span:first-child{color:var(--ink)}

  @media (max-width:620px){
    .hero-num{font-size:40px}
    .wrap{padding:0 14px}
    .mesnav h1{font-size:20px;min-width:140px}
    .w-val{width:106px}
    .hide-sm{display:none}
    .abas{overflow-x:auto}
    .aba{white-space:nowrap;padding:8px 11px;font-size:13px}
    .barras{height:150px;gap:3px}
    .barra-val{font-size:10px}
    .barra-rot{font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>

<script>
(function(){
  // Fora do Claude.ai, window.storage não existe — este bloco recria a
  // mesma interface usando localStorage do navegador. Os dados ficam
  // presos a este navegador/dispositivo específico (não sincronizam
  // entre aparelhos).
  window.storage = {
    get: async function(k){
      var v = localStorage.getItem(k);
      if(v===null){ var e=new Error('not found'); throw e; }
      return {key:k, value:v};
    },
    set: async function(k,v){ localStorage.setItem(k,v); return {key:k, value:v}; },
    list: async function(prefix){
      var keys=[];
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(!prefix || k.indexOf(prefix)===0) keys.push(k);
      }
      return {keys:keys};
    },
    delete: async function(k){ localStorage.removeItem(k); return {key:k, deleted:true}; }
  };
})();
</script>
<script>
(function(){
  var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  function money(n){ return BRL.format(n||0); }
  function parseNum(s){
    if(typeof s==='number') return s;
    if(!s) return 0;
    s=String(s).replace(/[^\d,.-]/g,'');
    if(s.indexOf(',')>-1){ s=s.replace(/\./g,'').replace(',','.'); }
    var v=parseFloat(s); return isNaN(v)?0:v;
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function nomeMes(id){ var p=id.split('-'); return MESES[+p[1]-1]+' de '+p[0]; }
  function nomeMesCurto(id){ var p=id.split('-'); return MESES[+p[1]-1]; }
  function proxId(id){ var p=id.split('-'),y=+p[0],m=+p[1]+1; if(m>12){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); }
  function antId(id){ var p=id.split('-'),y=+p[0],m=+p[1]-1; if(m<1){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
  function hojeId(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function dataCurta(d){ if(!d) return ''; var p=d.split('-'); return p[2]+'/'+p[1]; }

  var KEY_CFG='fin:config';

  async function sget(k){ try{ var r=await window.storage.get(k); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
  async function sset(k,v){ try{ var r=await window.storage.set(k,JSON.stringify(v)); return !!r; }catch(e){ toast('Não consegui salvar. Tente de novo.'); return false; } }
  async function slist(p){ try{ var r=await window.storage.list(p); return (r&&r.keys)?r.keys:[]; }catch(e){ return []; } }

  var cfg=null,mes=null,mesId=null,meses=[],filtroCat='todas';
  var vista='mes', jobs=[], financ=[], filtroTipo='todos';
  var KEY_JOBS='fin:jobs', KEY_FIN='fin:financiamentos';
  var imp={carregando:false,erro:null,itens:null,conta:'azul'};

  var CATEGORIAS=['Moradia','Transporte','Saúde','Alimentação','Pessoal','Impostos','Serviços','Lazer','Educação','Vestuário','Pets','Outros'];
  var CORES_CAT={'Moradia':'#2A5FA8','Transporte':'#8C6712','Saúde':'#2E6B4E','Alimentação':'#A8496B','Pessoal':'#7A4FB0','Impostos':'#9A3B2C','Serviços':'#35528F','Lazer':'#B0763F','Educação':'#3F8F8C','Vestuário':'#B0507A','Pets':'#5C8F3F','Outros':'#5E6B6B'};
  function corCat(c){ return CORES_CAT[c]||'#5E6B6B'; }

  var REGRAS_CATEGORIA=[
    ['Alimentação',/ifood|rappi|uber\s*eats|restaurante|lanchonete|padaria|a[cç]ougue|hortifruti|mercado|supermercado|feira|pizza|burger|mc\s*donald|habib|subway/i],
    ['Transporte',/uber|99app|99\s*pop|posto\b|combust[íi]vel|gasolina|etanol|estacionamento|ped[áa]gio|metr[oô]|[ôo]nibus|passagem a[ée]rea|localiza|movida/i],
    ['Saúde',/farm[áa]cia|drogaria|drogasil|pacheco|clínica|cl[ií]nica|hospital|laborat[oó]rio|exame|dentista|academia\b/i],
    ['Vestuário',/renner|riachuelo|c&a|zara|calçado|cal[çc]ados|marisa|hering|sapataria/i],
    ['Pets',/petz|cobasi|pet\s*shop|veterin[áa]rio|ra[çc][ãa]o/i],
    ['Lazer',/cinema|ingresso|show\b|balada|parque|airbnb|booking\.com|hotel|pousada|bar\b|choperia/i],
    ['Educação',/faculdade|universidade|curso\b|udemy|alura|mensalidade escolar|material escolar/i],
    ['Serviços',/netflix|spotify|amazon prime|hbo|disney\+|claro|vivo\b|tim\b|assinatura|internet\b|celular\b/i],

      ],

    return c.contasFixas.map(function(f){
      return {id:uid(),refId:f.id,nome:f.nome,dia:f.dia,valor:f.valor,categoria:f.categoria,pago:false};
    });
  }
  function mesNovo(id,c){
    return {
      entradas:c.entradasFixas.map(function(e){return {id:uid(),refId:e.id,nome:e.nome,valor:e.valor};}),
      fixas:fixasDoCfg(c),
      lancamentos:[],
      repasse:0,
      destino:{investir:0,guardar:0,repassar:0}
    };
  }

  function totEntradas(m){ return m.entradas.reduce(function(a,e){return a+(+e.valor||0);},0)+(+m.repasse||0)+totJobsMes(mesId); }
  function totFixas(m){ return m.fixas.reduce(function(a,f){return a+(+f.valor||0);},0); }
  function totLanc(m){ return m.lancamentos.reduce(function(a,l){return a+(+l.valor||0);},0); }
  function totDespesas(m){ return totFixas(m)+totLanc(m); }
  function sobra(m){ return totEntradas(m)-totDespesas(m); }
  function faltaPagar(m){ return m.fixas.filter(function(f){return !f.pago;}).reduce(function(a,f){return a+(+f.valor||0);},0); }
  function totConta(m,cid){ return m.lancamentos.filter(function(l){return l.conta===cid;}).reduce(function(a,l){return a+(+l.valor||0);},0); }
  function nomeConta(id){ var c=cfg.contas.filter(function(x){return x.id===id;})[0]; return c?c.nome:id; }
  function tipoConta(id){ var c=cfg.contas.filter(function(x){return x.id===id;})[0]; return c?c.tipo:'pix'; }
  function statusFixa(f){
    if(f.pago) return 'pago';
    if(mesId<hojeId()) return 'vencido';
    if(mesId>hojeId()) return 'apagar';
    return f.dia<new Date().getDate()?'vencido':'apagar';
  }
  function dataPadrao(){
    if(mesId===hojeId()){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    return mesId+'-01';
  }

  // ---------- leitura de texto colado ----------
  function promptExtracao(){
    return 'Você está lendo um extrato de cartão de crédito ou de conta bancária brasileira, colado como texto.\n'+
      'Extraia SOMENTE os gastos (débitos/compras). Ignore pagamentos de fatura, estornos, créditos, saldos, limites, totais da fatura e qualquer linha que não seja uma compra.\n'+
      'Para cada gasto devolva: data (formato AAAA-MM-DD; se o texto não trouxer o ano, use '+mesId.split('-')[0]+'; se não trouxer nem o mês, use '+mesId+'), descricao (nome do estabelecimento, limpo e curto; se houver parcela mantenha no formato "Nome (2/6)"), valor (número positivo com ponto decimal) e categoria (a que melhor descreve o gasto pelo nome do estabelecimento, escolhendo exatamente uma de: '+CATEGORIAS.join(', ')+').\n'+
      'Responda APENAS com um array JSON, sem texto antes ou depois, sem markdown, sem crase. Exemplo: [{"data":"2026-08-12","descricao":"Posto Shell","valor":180.5,"categoria":"Transporte"}]';
  }

  async function lerComIA(texto){
    var content=[{type:'text',text:'Extrato colado:\n'+texto},{type:'text',text:promptExtracao()}];
    var resp=await fetch('/api/read-receipt',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:content})
    });
    var data=await resp.json();
    var txt=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
    txt=txt.replace(/```json/g,'').replace(/```/g,'').trim();
    var ini=txt.indexOf('['), fim=txt.lastIndexOf(']');
    if(ini>-1&&fim>ini) txt=txt.slice(ini,fim+1);
    var arr=JSON.parse(txt);
    if(!Array.isArray(arr)) throw new Error('formato');
    return arr;
  }

  var NAO_GASTO=/pagamento|estorno|cr[ée]dito|limite|saldo|dispon[íi]vel|total da fatura|fatura anterior|fatura fechada|transfer[êe]ncia recebida|recebid/i;

  function lerTextoLocal(texto){
    var out=[];
    texto.split(/\n+/).forEach(function(linha){
      var l=linha.trim(); if(!l) return;
      if(NAO_GASTO.test(l)) return;
      var mv=l.match(/(-?\s*(?:R\$)?\s*\d{1,3}(?:\.\d{3})*,\d{2}|\d+[.,]\d{2})\s*$/);
      if(!mv) return;
      var valor=parseNum(mv[1]); if(!valor) return;
      var resto=l.slice(0,l.length-mv[0].length).trim();
      var md=resto.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      var data=mesId+'-01';
      if(md){
        var ano=md[3]?(md[3].length===2?'20'+md[3]:md[3]):mesId.split('-')[0];
        data=ano+'-'+String(md[2]).padStart(2,'0')+'-'+String(md[1]).padStart(2,'0');
        resto=resto.slice(md[0].length).trim();
      }
      resto=resto.replace(/^[\-–•|,;]+/,'').trim();
      if(!resto) resto='Gasto';
      out.push({data:data,descricao:resto,valor:Math.abs(valor),categoria:categoriaAuto(resto)});
    });
    return out;
  }

  var RX_PARCELA=/\(?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)?\s*$/;
  function detectaParcela(desc){
    var m=String(desc||'').match(RX_PARCELA);
    if(!m) return null;
    var atual=+m[1], total=+m[2];
    if(!atual||!total||atual>total||total>60) return null;
    return {atual:atual,total:total};
  }

  function normalizar(arr){
    return arr.map(function(x){
      var d=String(x.data||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=mesId+'-01';
      var desc=String(x.descricao||'Gasto').slice(0,80);
      var cat=CATEGORIAS.indexOf(x.categoria)>-1?x.categoria:categoriaAuto(desc);
      var pc=detectaParcela(desc);
      return {tid:uid(),data:d,descricao:desc,valor:Math.abs(+x.valor||0),categoria:cat,usar:true,parcelado:!!pc,parcelaInfo:pc?(pc.atual+'/'+pc.total):''};
    }).filter(function(x){ return x.valor>0; });
  }

  async function processar(texto){
    imp.carregando=true; imp.erro=null; imp.itens=null; render();
    try{
      var arr=await lerComIA(texto);
      imp.itens=normalizar(arr);
      if(!imp.itens.length) imp.erro='Não encontrei nenhum gasto nesse texto.';
    }catch(e){
      var loc=normalizar(lerTextoLocal(texto));
      if(loc.length){ imp.itens=loc; imp.erro='Li o texto sem a ajuda da IA, então as categorias foram um chute a partir do nome. Confira antes de lançar.'; }
      else imp.erro='Não consegui entender esse texto. Cada linha precisa terminar com o valor.';
    }
    imp.carregando=false; render();
  }

  var TIPOS=[{id:'recorrente',rot:'Recorrente'},{id:'avulso',rot:'Avulso'},{id:'freela',rot:'Freela'}];
  function tipoJob(j){ return TIPOS.filter(function(t){return t.id===j.tipo;})[0]?j.tipo:'avulso'; }
  function rotTipo(id){ var t=TIPOS.filter(function(x){return x.id===id;})[0]; return t?t.rot:'Avulso'; }

  // ---------- faturamento ----------
  function jobsDoMes(id){ return jobs.filter(function(j){return j.mes===id;}); }
  function totJobsMes(id){ return jobsDoMes(id).reduce(function(a,j){return a+(+j.valor||0);},0); }
  function recebidoJob(j){ return +j.recebido||0; }
  function abertoJob(j){ return Math.max((+j.valor||0)-recebidoJob(j),0); }
  function statusJob(j){
    var r=recebidoJob(j);
    if(r<=0) return {k:'apagar',rot:'A receber'};
    if(r+0.005<(+j.valor||0)) return {k:'apagar',rot:'Parcial'};
    return {k:'pago',rot:'Recebido'};
  }
  function mesesDoAno(ano){
    var out=[]; for(var i=1;i<=12;i++) out.push(ano+'-'+String(i).padStart(2,'0')); return out;
  }

  function barras(valores, rotulos, destaque){
    var max=Math.max.apply(null,valores.concat([1]));
    var h='<div class="barras">';
    valores.forEach(function(v,i){
      var alt=v>0?Math.max(Math.round(v/max*100),3):0;
      h+='<div class="barra-col"'+(v>0?' title="'+esc(rotulos[i])+': '+money(v)+'"':'')+'>';
      h+='<div class="barra-topo">'+(v>0?'<span class="barra-val">'+(v>=1000?(Math.round(v/100)/10).toLocaleString('pt-BR')+'k':Math.round(v))+'</span>':'')+'</div>';
      h+='<div class="barra-trilho"><div class="barra-fill'+(destaque===i?' alto':'')+'" style="height:'+alt+'%"></div></div>';
      h+='<div class="barra-rot">'+esc(rotulos[i])+'</div></div>';
    });
    return h+'</div>';
  }

    }
    h+='</section>';

  // ---------- financiamentos ----------
  function pagasFin(f){ return Math.min(Math.max(+f.pagas||0,0),+f.total||0); }
  function faltamFin(f){ return Math.max((+f.total||0)-pagasFin(f),0); }
  function restaFin(f){ return faltamFin(f)*(+f.valor||0); }
  function terminoFin(f){
    var n=faltamFin(f); if(!n) return 'quitado';
    var d=new Date(), m=d.getMonth()+n, y=d.getFullYear()+Math.floor(m/12);
    return MESES[m%12]+' de '+y;
  }

        h+='</div></div></div>';
      });
      h+='<div class="sec-note">Este painel é só o acompanhamento do contrato. A parcela do mês continua sendo contada uma única vez, em contas fixas — aqui ela não entra de novo nas despesas.</div>';

    h+='</section>';

  }

  // ---------- cartões ----------

  async function salvar(){ await sset(keyMes(mesId),mes); }

  async function irPara(id){
    var m=await sget(keyMes(id));
    if(!m){
      var ant=await sget(keyMes(antId(id)));
      m=mesNovo(id,cfg);
      if(ant&&ant.destino&&+ant.destino.repassar) m.repasse=+ant.destino.repassar;
      await sset(keyMes(id),m);
      meses=await carregarMeses();
    }
    mesId=id; mes=m; filtroCat='todas'; imp={carregando:false,erro:null,itens:null,conta:imp.conta};
    await garantirDraHeloisa();
    render(); window.scrollTo({top:0});
  }
  async function carregarMeses(){
    var ks=await slist('fin:mes:');
    return ks.map(function(k){return k.replace('fin:mes:','');}).sort();
  }

  function exportarJobs(){
    var L=[['Mês','Data','Cliente/Job','Tipo','Orçamento','Recebido','Falta receber','Situação']];
    jobsDoMes(mesId).slice().sort(function(a,b){return (a.data||'').localeCompare(b.data||'');}).forEach(function(j){
      var st=statusJob(j);
      L.push([mesId,j.data||'',j.cliente,rotTipo(tipoJob(j)),(+j.valor||0).toFixed(2),recebidoJob(j).toFixed(2),abertoJob(j).toFixed(2),st.rot]);
    });
    var csv='\ufeff'+L.map(function(l){return l.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='faturamento-'+mesId+'.csv'; a.click();
    toast('Faturamento de '+nomeMesCurto(mesId)+' baixado.');
  }

  async function exportarBackup(){
    var keys=await slist('fin:');
    var bundle={};
    for(var i=0;i<keys.length;i++){
      try{ var r=await window.storage.get(keys[i]); bundle[keys[i]]=r.value; }catch(e){}
    }
    var blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='backup-financas-'+hojeId()+'.json'; a.click();
    toast('Backup baixado — '+keys.length+' itens.');
  }

  async function importarBackup(file){
    try{
      var texto=await file.text();
      var bundle=JSON.parse(texto);
      var n=0;
      for(var k in bundle){
        if(Object.prototype.hasOwnProperty.call(bundle,k)){ localStorage.setItem(k,bundle[k]); n++; }
      }
      toast('Backup importado — '+n+' itens. Recarregando…');
      setTimeout(function(){ location.reload(); },1200);
    }catch(e){
      toast('Não consegui ler esse arquivo de backup.');
    }
  }

    var L=[['Mês','Tipo','Item','Categoria','Data/Dia','Pago com','Valor','Situação']];
    var jm=jobsDoMes(mesId);
    if(jm.length) L.push([mesId,'Entrada','Jobs de '+nomeMesCurto(mesId)+' ('+jm.length+')','','','',totJobsMes(mesId).toFixed(2),'']);
    if(+mes.repasse) L.push([mesId,'Entrada','Sobra de '+nomeMesCurto(antId(mesId)),'','','',(+mes.repasse).toFixed(2),'']);
    mes.entradas.forEach(function(e){ L.push([mesId,'Entrada',e.nome,'','','',(+e.valor||0).toFixed(2),'']); });
    mes.fixas.forEach(function(f){ L.push([mesId,'Conta fixa',f.nome,f.categoria,'dia '+f.dia,'',(+f.valor||0).toFixed(2),f.pago?'Pago':'A pagar']); });
    mes.lancamentos.forEach(function(l){ L.push([mesId,'Gasto',l.descricao,l.categoria,l.data||'',nomeConta(l.conta),(+l.valor||0).toFixed(2),'']); });
    L.push([mesId,'Resumo','Total de entradas','','','',totEntradas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Total de saídas','','','',totDespesas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Sobra','','','',sobra(mes).toFixed(2),'']);
    var csv='\ufeff'+L.map(function(l){return l.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='financas-'+mesId+'.csv'; a.click();
    toast('CSV de '+nomeMesCurto(mesId)+' baixado.');
  }

  document.addEventListener('click',async function(ev){
    var t=ev.target.closest&&ev.target.closest('button'); if(!t) return;
    var app=document.getElementById('app'); if(!app||!app.contains(t)) return;

    if(t.dataset.vista){ vista=t.dataset.vista; render(); window.scrollTo({top:0}); return; }
    if(t.dataset.ftipo){ filtroTipo=t.dataset.ftipo; render(); return; }
    if(t.dataset.nav==='ant'){ var i=meses.indexOf(mesId); if(i>0) await irPara(meses[i-1]); return; }
    if(t.dataset.nav==='prox'){ await irPara(proxId(mesId)); return; }
    if(t.dataset.filtro){ filtroCat=t.dataset.filtro; render(); return; }
    if(t.dataset.toggle){
      var f=mes.fixas.filter(function(x){return x.id===t.dataset.toggle;})[0];
      if(f){ f.pago=!f.pago; await salvar(); render(); } return;
    }
    if(t.dataset.del==='job'){
      jobs=jobs.filter(function(x){return x.id!==t.dataset.id;});
      await sset(KEY_JOBS,jobs); render(); return;
    }
    if(t.dataset.del==='financ'){
      financ=financ.filter(function(x){return x.id!==t.dataset.id;});
      await sset(KEY_FIN,financ); render(); return;
    }
    if(t.dataset.del){
      var id=t.dataset.id,tp=t.dataset.del,cfgMudou=false;
      if(tp==='entrada'){
        var ea=mes.entradas.filter(function(x){return x.id===id;})[0];
        if(ea&&ea.refId){ cfg.entradasFixas=cfg.entradasFixas.filter(function(x){return x.id!==ea.refId;}); cfgMudou=true; }
        mes.entradas=mes.entradas.filter(function(x){return x.id!==id;});
      }
      if(tp==='fixa'){
        var fa=mes.fixas.filter(function(x){return x.id===id;})[0];
        if(fa&&fa.refId){ cfg.contasFixas=cfg.contasFixas.filter(function(x){return x.id!==fa.refId;}); cfgMudou=true; }
        mes.fixas=mes.fixas.filter(function(x){return x.id!==id;});
      }
      if(tp==='lanc') mes.lancamentos=mes.lancamentos.filter(function(x){return x.id!==id;});
      if(cfgMudou) await sset(KEY_CFG,cfg);
      await salvar(); render(); return;
    }

    var act=t.dataset.act;
    if(act==='add-entrada'){
      var n=document.getElementById('ne-nome').value.trim(),v=parseNum(document.getElementById('ne-val').value);
      if(!n||!v){ toast('Preencha de onde vem e o valor.'); return; }
      var cbf=document.getElementById('ne-fixa'), repete=cbf?cbf.checked:false, rid=null;
      if(repete){
        rid='e'+uid();
        cfg.entradasFixas.push({id:rid,nome:n,valor:v});
        await sset(KEY_CFG,cfg);
      }
      mes.entradas.push({id:uid(),refId:rid,nome:n,valor:v}); await salvar(); render(); return;
    }
    if(act==='add-fixa'){
      var nf=document.getElementById('nf-nome').value.trim();
      var d=parseInt(document.getElementById('nf-dia').value,10);
      var vf=parseNum(document.getElementById('nf-val').value);
      var cat=document.getElementById('nf-cat').value;
      if(!nf||!d){ toast('Preencha o nome da conta e o dia do vencimento.'); return; }
      var novo={id:'c'+uid(),nome:nf,dia:Math.min(Math.max(d,1),31),valor:vf,categoria:cat};
      cfg.contasFixas.push(novo); await sset(KEY_CFG,cfg);
      mes.fixas.push({id:uid(),refId:novo.id,nome:novo.nome,dia:novo.dia,valor:novo.valor,categoria:cat,pago:false});
      await salvar(); render(); return;
    }
    if(act==='add-lanc'){
      var desc=document.getElementById('nl-desc').value.trim(),vl=parseNum(document.getElementById('nl-val').value);
      if(!desc||!vl){ toast('Preencha a descrição e o valor.'); return; }
      mes.lancamentos.push({id:uid(),data:document.getElementById('nl-data').value||mesId+'-01',descricao:desc,
        categoria:document.getElementById('nl-cat').value,valor:vl,conta:document.getElementById('nl-conta').value});
      await salvar(); render(); return;
    }
    if(act==='add-cartao'){
      var descC=document.getElementById('nc-desc').value.trim(),vlC=parseNum(document.getElementById('nc-val').value);
      if(!descC||!vlC){ toast('Preencha a descrição e o valor.'); return; }
      mes.lancamentos.push({id:uid(),data:document.getElementById('nc-data').value||mesId+'-01',descricao:descC,
        categoria:document.getElementById('nc-cat').value,valor:vlC,conta:document.getElementById('nc-conta').value,
        parcelado:document.getElementById('nc-parc').checked});
      await salvar(); render(); return;
    }
    if(act==='ler-texto'){
      var tx=document.getElementById('imp-texto').value.trim();
      if(!tx){ toast('Cole o texto dos gastos primeiro.'); return; }
      await processar(tx); return;
    }
    if(act==='cancelar-import'){ imp.itens=null; imp.erro=null; render(); return; }
    if(act==='confirmar-import'){
      var usar=imp.itens.filter(function(i){return i.usar&&i.valor>0;});
      usar.forEach(function(i){
        mes.lancamentos.push({id:uid(),data:i.data,descricao:i.descricao,categoria:i.categoria,valor:i.valor,conta:imp.conta,parcelado:!!i.parcelado});
      });
      imp.itens=null; imp.erro=null;
      await salvar(); render();
      toast(usar.length+(usar.length===1?' gasto lançado':' gastos lançados')+' em '+nomeConta(imp.conta)+'.');
      return;
    }
    if(act==='add-job'){
      var cli=document.getElementById('nj-cli').value.trim();
      var vj=parseNum(document.getElementById('nj-val').value);
      var dj=document.getElementById('nj-data').value||mesId+'-01';
      var tj=document.getElementById('nj-tipo').value;
      var aj=document.getElementById('nj-ate').value;
      if(!cli||!vj){ toast('Preencha o cliente e o valor.'); return; }
      var mj=dj.slice(0,7), dia=dj.slice(8,10);
      if(tj==='recorrente'&&aj>mj){
        var grupo=uid(), cur=mj, n=0;
        while(cur<=aj&&n<12){
          jobs.push({id:uid(),grupo:grupo,cliente:cli,tipo:tj,mes:cur,data:cur+'-'+dia,valor:vj,recebido:0});
          cur=proxId(cur); n++;
        }
        await sset(KEY_JOBS,jobs); render();
        toast(cli+' lançado em '+n+' meses.');
        return;
      }
      jobs.push({id:uid(),cliente:cli,tipo:tj,mes:mj,data:dj,valor:vj,recebido:0});
      await sset(KEY_JOBS,jobs); render(); return;
    }
    if(act==='add-financ'){
      var nfi=document.getElementById('nfi-nome').value.trim();
      var vfi=parseNum(document.getElementById('nfi-val').value);
      var tfi=parseInt(document.getElementById('nfi-tot').value,10)||0;
      var pfi=parseInt(document.getElementById('nfi-pag').value,10)||0;
      if(!nfi||!vfi||!tfi){ toast('Preencha o nome, o valor da parcela e o total de parcelas.'); return; }
      financ.push({id:uid(),nome:nfi,valor:vfi,total:tfi,pagas:Math.min(pfi,tfi)});
      await sset(KEY_FIN,financ); render(); return;
    }
    if(act==='pagar-parcela'||act==='desfazer-parcela'){
      var ff=financ.filter(function(x){return x.id===t.dataset.id;})[0];
      if(ff){
        ff.pagas=act==='pagar-parcela'?Math.min((+ff.pagas||0)+1,+ff.total||0):Math.max((+ff.pagas||0)-1,0);
        await sset(KEY_FIN,financ); render();
      }
      return;
    }
    if(act==='export-jobs'){ exportarJobs(); return; }
    if(act==='export-backup'){ await exportarBackup(); return; }
    if(act==='import-backup'){ document.getElementById('arqBackup').click(); return; }
    if(act==='export'){ exportarCSV(); return; }
    if(act==='reset'){
      if(!confirm('Isso apaga tudo e volta para agosto vazio, só com a lista de contas fixas. Continuar?')) return;
      for(var k=0;k<meses.length;k++){ try{ await window.storage.delete(keyMes(meses[k])); }catch(e){} }
      try{ await window.storage.delete(KEY_CFG); }catch(e){}
      await iniciar(true); return;
    }
  });

  document.addEventListener('change',async function(ev){
    var el=ev.target; if(!el.dataset) return;

    if(el.dataset.rev){
      var it=imp.itens&&imp.itens.filter(function(x){return x.tid===el.dataset.tid;})[0];
      if(!it) return;
      if(el.dataset.rev==='usar') it.usar=el.checked;
      if(el.dataset.rev==='parcelado') it.parcelado=el.checked;
      if(el.dataset.rev==='descricao') it.descricao=el.value.trim()||'Gasto';
      if(el.dataset.rev==='categoria') it.categoria=el.value;
      if(el.dataset.rev==='valor') it.valor=Math.abs(parseNum(el.value));
      render(); return;
    }
    if(el.id==='imp-conta'){ imp.conta=el.value; return; }

    if(el.dataset.jedit){
      var jx=jobs.filter(function(x){return x.id===el.dataset.id;})[0];
      if(jx){
        if(el.dataset.jedit==='tipo') jx.tipo=el.value;
        else if(el.dataset.jedit==='recebido') jx.recebido=Math.abs(parseNum(el.value));
        else jx.valor=Math.abs(parseNum(el.value));
        await sset(KEY_JOBS,jobs); render();
      }
      return;
    }
    if(el.dataset.edit){
      var v=parseNum(el.value),id=el.dataset.id,tp=el.dataset.edit,alvo=null;
      if(tp==='entrada') alvo=mes.entradas.filter(function(x){return x.id===id;})[0];
      if(tp==='fixa') alvo=mes.fixas.filter(function(x){return x.id===id;})[0];
      if(tp==='lanc') alvo=mes.lancamentos.filter(function(x){return x.id===id;})[0];
      if(alvo){
        alvo.valor=v;
        if(alvo.refId&&(tp==='fixa'||tp==='entrada')){
          var lista=tp==='fixa'?cfg.contasFixas:cfg.entradasFixas;
          var tpl=lista.filter(function(x){return x.id===alvo.refId;})[0];
          if(tpl){ tpl.valor=v; await sset(KEY_CFG,cfg); }
        }
        await salvar(); render();
      }
      return;
    }
    if(el.dataset.dest){
      mes.destino=mes.destino||{investir:0,guardar:0,repassar:0};
      mes.destino[el.dataset.dest]=parseNum(el.value);
      await salvar();
      var prox=await sget(keyMes(proxId(mesId)));
      if(prox){ prox.repasse=+mes.destino.repassar||0; await sset(keyMes(proxId(mesId)),prox); }
      render(); return;
    }
  });

  async function corrigirSeedJobs(){
    var flag=await sget('fin:jobs_seed_v2');
    if(flag) return;
    jobs=jobs.filter(function(j){ return j.grupo!=='seed-izaldo' && j.grupo!=='seed-helo'; });
    var valores={'2026-01':9900,'2026-02':18900,'2026-03':1500,'2026-04':14600,'2026-05':13150,'2026-06':14000,'2026-07':15750,'2026-08':12500};
    Object.keys(valores).forEach(function(id){
      jobs.push({id:uid(),grupo:'seed-total',cliente:'Faturamento do mês',tipo:'avulso',mes:id,data:id+'-01',valor:valores[id],recebido:0});
    });
    await sset(KEY_JOBS,jobs);
    await sset('fin:jobs_seed_v2',true);
  }

  async function garantirDraHeloisa(){
    var ja=mes.entradas.some(function(e){ return /helo[ií]sa/i.test(e.nome||''); });
    if(ja) return;
    var tpl=cfg.entradasFixas.filter(function(e){return /helo[ií]sa/i.test(e.nome||'');})[0];
    var rid;
    if(tpl){ rid=tpl.id; }
    else{ rid='e'+uid(); cfg.entradasFixas.push({id:rid,nome:'Dra. Heloísa',valor:5500}); await sset(KEY_CFG,cfg); }
    mes.entradas.push({id:uid(),refId:rid,nome:'Dra. Heloísa',valor:5500});
    await salvar();
  }

  async function corrigirMarco(){
    var flag=await sget('fin:jobs_fix_mar');
    if(flag) return;
    var alvo=jobs.filter(function(j){return j.grupo==='seed-total'&&j.mes==='2026-03';})[0];
    if(alvo){ alvo.valor=15000; await sset(KEY_JOBS,jobs); }
    await sset('fin:jobs_fix_mar',true);
  }
  async function iniciar(forcar){
    cfg=forcar?null:await sget(KEY_CFG);
    if(cfg&&cfg.versao!==VERSAO) cfg=null;
    if(!cfg){
      var antigos=await slist('fin:mes:');
      for(var j=0;j<antigos.length;j++){ try{ await window.storage.delete(antigos[j]); }catch(e){} }
      cfg=cfgSemente();
      await sset(KEY_CFG,cfg);
      await sset(keyMes('2026-08'),mesNovo('2026-08',cfg));
    }
    meses=await carregarMeses();
    jobs=await sget(KEY_JOBS)||[];
    await corrigirSeedJobs();
    await corrigirMarco();
    financ=await sget(KEY_FIN)||[];
    if(!meses.length){ await sset(keyMes('2026-08'),mesNovo('2026-08',cfg)); meses=['2026-08']; }
    var alvo=meses.indexOf(hojeId())>-1?hojeId():meses[meses.length-1];
    mesId=alvo; mes=await sget(keyMes(alvo))||mesNovo(alvo,cfg);
    imp.conta=cfg.contas[0].id;
    await garantirDraHeloisa();
    render();
  }

  iniciar(false).catch(function(e){
    document.getElementById('app').innerHTML='<div class="wrap"><p class="boot">Não consegui abrir o armazenamento. Recarregue a página para tentar de novo.</p></div>';
  });
})();
</script>
