    if(!vis.length){
      h+='<div class="vazio">'+(lancs.length?'Nada nessa categoria.':'Nenhum gasto em dinheiro ou Pix lançado ainda neste mês.')+'</div>';
    }else{
      h+='<table><thead><tr><th style="width:66px">Data</th><th>Descrição</th><th class="hide-sm">Categoria</th><th class="hide-sm">Pago com</th><th class="r">Valor</th><th></th></tr></thead><tbody>';
      vis.forEach(function(l){
        h+='<tr><td class="dim val">'+esc(dataCurta(l.data))+'</td>';
        h+='<td><span class="nome">'+esc(l.descricao)+'</span></td>';
        h+='<td class="hide-sm">'+catSelect('lanc',l.id,l.categoria)+'</td>';
        h+='<td class="hide-sm dim">'+esc(nomeConta(l.conta))+'</td>';
        h+='<td class="r"><input class="inline-val" data-edit="lanc" data-id="'+l.id+'" value="'+money(l.valor)+'"></td>';
        h+='<td class="r" style="width:34px"><button class="del" data-del="lanc" data-id="'+l.id+'" aria-label="Remover">×</button></td></tr>';
      });
      h+='</tbody></table>';
    }
    h+='</section>';

    return h;
  }

  function render(){
    var h='<div class="wrap">';
    h+='<nav class="abas">';
    [['mes','Mês a mês'],['resumo','Resumo'],['jobs','Faturamento'],['cartoes','Cartões'],['financ','Financiamentos'],['invest','Investimentos']].forEach(function(a){
      h+='<button class="aba" data-vista="'+a[0]+'" aria-pressed="'+(vista===a[0])+'">'+a[1]+'</button>';
    });
    h+='</nav>';
    h+= vista==='jobs' ? viewJobs() : (vista==='cartoes' ? viewCartoes() : (vista==='financ' ? viewFinanc() : (vista==='invest' ? viewInvest() : (vista==='resumo' ? viewResumo() : viewMes()))));
    h+='<div class="rodape">Seus dados ficam salvos só para você e continuam aqui quando voltar. Ainda assim, baixe o CSV de vez em quando — é o seu backup.</div></div>';
    document.getElementById('app').innerHTML=h;
  }

  var inputBackup=document.getElementById('arqBackup');
  inputBackup.addEventListener('change',function(){
    if(inputBackup.files&&inputBackup.files[0]) importarBackup(inputBackup.files[0]);
    inputBackup.value='';
  });

  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600);
  }

  async function salvar(){ await sset(keyMes(mesId),mes); }

  async function irPara(id){
    var m=await sget(keyMes(id));
    if(!m){
      var ant=await sget(keyMes(antId(id)));
      m=mesNovo(id,cfg);
      if(ant&&ant.destino&&+ant.destino.repassar) m.repasse=+ant.destino.repassar;
      await sset(keyMes(id),m);
      meses=await carregarMeses();
    }
    mesId=id; mes=m; filtroCat='todas'; imp={carregando:false,erro:null,itens:null,conta:imp.conta};
    await garantirDraHeloisa();
    render(); window.scrollTo({top:0});
  }
  async function carregarMeses(){
    var ks=await slist('fin:mes:');
    return ks.map(function(k){return k.replace('fin:mes:','');}).sort();
  }

  function exportarJobs(){
    var L=[['Mês','Data','Cliente/Job','Tipo','Orçamento','Recebido','Falta receber','Situação']];
    jobsDoMes(mesId).slice().sort(function(a,b){return (a.data||'').localeCompare(b.data||'');}).forEach(function(j){
      var st=statusJob(j);
      L.push([mesId,j.data||'',j.cliente,rotTipo(tipoJob(j)),(+j.valor||0).toFixed(2),recebidoJob(j).toFixed(2),abertoJob(j).toFixed(2),st.rot]);
    });
    var csv='\ufeff'+L.map(function(l){return l.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='faturamento-'+mesId+'.csv'; a.click();
    toast('Faturamento de '+nomeMesCurto(mesId)+' baixado.');
  }

  async function exportarBackup(){
    var keys=await slist('fin:');
    var bundle={};
    for(var i=0;i<keys.length;i++){
      try{ var r=await window.storage.get(keys[i]); bundle[keys[i]]=r.value; }catch(e){}
    }
    var blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='backup-financas-'+hojeId()+'.json'; a.click();
    toast('Backup baixado — '+keys.length+' itens.');
  }

  async function importarBackup(file){
    try{
      var texto=await file.text();
      var bundle=JSON.parse(texto);
      var chaves=Object.keys(bundle);
      for(var i=0;i<chaves.length;i++){ await window.storage.set(chaves[i],bundle[chaves[i]]); }
      toast('Backup importado — '+chaves.length+' itens. Recarregando…');
      setTimeout(function(){ location.reload(); },1200);
    }catch(e){
      toast('Não consegui ler esse arquivo de backup.');
    }
  }

  function exportarCSV(){
    var L=[['Mês','Tipo','Item','Categoria','Data/Dia','Pago com','Valor','Situação']];
    var jm=jobsDoMes(mesId);
    if(jm.length) L.push([mesId,'Entrada','Jobs de '+nomeMesCurto(mesId)+' ('+jm.length+')','','','',totJobsMes(mesId).toFixed(2),'']);
    if(+mes.repasse) L.push([mesId,'Entrada','Sobra de '+nomeMesCurto(antId(mesId)),'','','',(+mes.repasse).toFixed(2),'']);
    mes.entradas.forEach(function(e){ L.push([mesId,'Entrada',e.nome,'','','',(+e.valor||0).toFixed(2),'']); });
    mes.fixas.forEach(function(f){ L.push([mesId,'Conta fixa',f.nome,f.categoria,'dia '+f.dia,'',(+f.valor||0).toFixed(2),f.pago?'Pago':'A pagar']); });
    mes.lancamentos.forEach(function(l){ L.push([mesId,'Gasto',l.descricao,l.categoria,l.data||'',nomeConta(l.conta),(+l.valor||0).toFixed(2),'']); });
    L.push([mesId,'Resumo','Total de entradas','','','',totEntradas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Total de saídas','','','',totDespesas(mes).toFixed(2),'']);
    L.push([mesId,'Resumo','Sobra','','','',sobra(mes).toFixed(2),'']);
    var csv='\ufeff'+L.map(function(l){return l.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='financas-'+mesId+'.csv'; a.click();
    toast('CSV de '+nomeMesCurto(mesId)+' baixado.');
  }

  document.addEventListener('click',async function(ev){
    var t=ev.target.closest&&ev.target.closest('button'); if(!t) return;
    var app=document.getElementById('app'); if(!app||!app.contains(t)) return;

    if(t.dataset.vista){ vista=t.dataset.vista; render(); window.scrollTo({top:0}); return; }
    if(t.dataset.ftipo){ filtroTipo=t.dataset.ftipo; render(); return; }
    if(t.dataset.nav==='ant'){ var i=meses.indexOf(mesId); if(i>0) await irPara(meses[i-1]); return; }
    if(t.dataset.nav==='prox'){ await irPara(proxId(mesId)); return; }
    if(t.dataset.filtro){ filtroCat=t.dataset.filtro; render(); return; }
    if(t.dataset.toggle){
      var f=mes.fixas.filter(function(x){return x.id===t.dataset.toggle;})[0];
      if(f){ f.pago=!f.pago; await salvar(); render(); } return;
    }
    if(t.dataset.toggleGrupo){
      var tg=t.dataset.toggleGrupo;
      gruposInvestFechados[tg]=!gruposInvestFechados[tg];
      render(); return;
    }
    if(t.dataset.setVistaCarteira){ vistaCarteiraInvest=t.dataset.setVistaCarteira; render(); return; }
    if(t.dataset.setAgruparCarteira){ agruparCarteiraInvest=t.dataset.setAgruparCarteira; render(); return; }
    if(t.dataset.del==='job'){
      jobs=jobs.filter(function(x){return x.id!==t.dataset.id;});
      await sset(KEY_JOBS,jobs); render(); return;
    }
    if(t.dataset.del==='financ'){
      financ=financ.filter(function(x){return x.id!==t.dataset.id;});
      await sset(KEY_FIN,financ); render(); return;
    }
    if(t.dataset.del==='invest'){
      investimentos=investimentos.filter(function(x){return x.id!==t.dataset.id;});
      await sset(KEY_INVEST,investimentos); render(); return;
    }
    if(t.dataset.del){
      var id=t.dataset.id,tp=t.dataset.del,cfgMudou=false;
      if(tp==='entrada'){
        var ea=mes.entradas.filter(function(x){return x.id===id;})[0];
        if(ea&&ea.refId){ cfg.entradasFixas=cfg.entradasFixas.filter(function(x){return x.id!==ea.refId;}); cfgMudou=true; }
        mes.entradas=mes.entradas.filter(function(x){return x.id!==id;});
      }
      if(tp==='fixa'){
        var fa=mes.fixas.filter(function(x){return x.id===id;})[0];
        if(fa&&fa.refId){ cfg.contasFixas=cfg.contasFixas.filter(function(x){return x.id!==fa.refId;}); cfgMudou=true; }
        mes.fixas=mes.fixas.filter(function(x){return x.id!==id;});
      }
      if(tp==='lanc') mes.lancamentos=mes.lancamentos.filter(function(x){return x.id!==id;});
      if(cfgMudou) await sset(KEY_CFG,cfg);
      await salvar(); render(); return;
    }

    var act=t.dataset.act;
    if(act==='add-fixa'){
      var nf=document.getElementById('nf-nome').value.trim();
      var d=parseInt(document.getElementById('nf-dia').value,10);
      var vf=parseNum(document.getElementById('nf-val').value);
      var cat=document.getElementById('nf-cat').value;
      if(!nf||!d){ toast('Preencha o nome da conta e o dia do vencimento.'); return; }
      var novo={id:'c'+uid(),nome:nf,dia:Math.min(Math.max(d,1),31),valor:vf,categoria:cat};
      cfg.contasFixas.push(novo); await sset(KEY_CFG,cfg);
      mes.fixas.push({id:uid(),refId:novo.id,nome:novo.nome,dia:novo.dia,valor:novo.valor,categoria:cat,pago:false});
      await salvar(); render(); return;
    }
    if(act==='add-lanc'){
      var desc=document.getElementById('nl-desc').value.trim(),vl=parseNum(document.getElementById('nl-val').value);
      if(!desc||!vl){ toast('Preencha a descrição e o valor.'); return; }
      mes.lancamentos.push({id:uid(),data:document.getElementById('nl-data').value||mesId+'-01',descricao:desc,
        categoria:document.getElementById('nl-cat').value,valor:vl,conta:document.getElementById('nl-conta').value});
      await salvar(); render(); return;
    }
    if(act==='add-cartao'){
      var descC=document.getElementById('nc-desc').value.trim(),vlC=parseNum(document.getElementById('nc-val').value);
      if(!descC||!vlC){ toast('Preencha a descrição e o valor.'); return; }
      var dataC=document.getElementById('nc-data').value||mesId+'-01';
      var catC=document.getElementById('nc-cat').value, contaC=document.getElementById('nc-conta').value;
      var pc=detectaParcela(descC);
      mes.lancamentos.push({id:uid(),data:dataC,descricao:descC,categoria:catC,valor:vlC,conta:contaC,parcelado:!!pc});
      await salvar();
      if(pc) await propagarParcelas({data:dataC,categoria:catC,valor:vlC,conta:contaC,descricao:descC},pc);
      render(); return;
    }
    if(act==='ler-texto'){
      var tx=document.getElementById('imp-texto').value.trim();
      if(!tx){ toast('Cole o texto dos gastos primeiro.'); return; }
      await processar(tx); return;
    }
    if(act==='cancelar-import'){ imp.itens=null; imp.erro=null; render(); return; }
    if(act==='confirmar-import'){
      var usar=imp.itens.filter(function(i){return i.usar&&i.valor>0;});
      var paraPropagar=[];
      usar.forEach(function(i){
        mes.lancamentos.push({id:uid(),data:i.data,descricao:i.descricao,categoria:i.categoria,valor:i.valor,conta:imp.conta,parcelado:!!i.parcelado});
        if(i.parcelado){
          var pc=detectaParcela(i.descricao);
          if(pc) paraPropagar.push({lanc:{data:i.data,descricao:i.descricao,categoria:i.categoria,valor:i.valor,conta:imp.conta},pc:pc});
        }
      });
      imp.itens=null; imp.erro=null;
      await salvar();
      for(var pi=0;pi<paraPropagar.length;pi++){ await propagarParcelas(paraPropagar[pi].lanc,paraPropagar[pi].pc); }
      render();
      toast(usar.length+(usar.length===1?' gasto lançado':' gastos lançados')+' em '+nomeConta(imp.conta)+'.');
      return;
    }
    if(act==='add-job'){
      var cli=document.getElementById('nj-cli').value.trim();
      var vj=parseNum(document.getElementById('nj-val').value);
      var dj=document.getElementById('nj-data').value||mesId+'-01';
      var tj=document.getElementById('nj-tipo').value;
      var aj=document.getElementById('nj-ate').value;
      if(!cli||!vj){ toast('Preencha o cliente e o valor.'); return; }
      var mj=dj.slice(0,7), dia=dj.slice(8,10);
      if(tj==='recorrente'&&aj>mj){
        var grupo=uid(), cur=mj, n=0;
        while(cur<=aj&&n<12){
          jobs.push({id:uid(),grupo:grupo,cliente:cli,tipo:tj,mes:cur,data:cur+'-'+dia,valor:vj,recebido:0});
          cur=proxId(cur); n++;
        }
        await sset(KEY_JOBS,jobs); render();
        toast(cli+' lançado em '+n+' meses.');
        return;
      }
      jobs.push({id:uid(),cliente:cli,tipo:tj,mes:mj,data:dj,valor:vj,recebido:0});
      await sset(KEY_JOBS,jobs); render(); return;
    }
    if(act==='add-financ'){
      var nfi=document.getElementById('nfi-nome').value.trim();
      var vfi=parseNum(document.getElementById('nfi-val').value);
      var tfi=parseInt(document.getElementById('nfi-tot').value,10)||0;
      var pfi=parseInt(document.getElementById('nfi-pag').value,10)||0;
      if(!nfi||!vfi||!tfi){ toast('Preencha o nome, o valor da parcela e o total de parcelas.'); return; }
      financ.push({id:uid(),nome:nfi,valor:vfi,total:tfi,pagas:Math.min(pfi,tfi)});
      await sset(KEY_FIN,financ); render(); return;
    }
    if(act==='pagar-parcela'||act==='desfazer-parcela'){
      var ff=financ.filter(function(x){return x.id===t.dataset.id;})[0];
      if(ff){
        ff.pagas=act==='pagar-parcela'?Math.min((+ff.pagas||0)+1,+ff.total||0):Math.max((+ff.pagas||0)-1,0);
        await sset(KEY_FIN,financ); render();
      }
      return;
    }
    if(act==='add-invest'){
      var tpi=document.getElementById('nvi-tipo').value;
      var dti=document.getElementById('nvi-data').value||dataPadrao();
      var obsi=document.getElementById('nvi-obs').value.trim();
      var novoInv={id:uid(),tipo:tpi,data:dti,obs:obsi};
      if(tpi==='acao'){
        var tk=document.getElementById('nvi-ticker').value.trim().toUpperCase();
        var qt=parseNum(document.getElementById('nvi-qtd').value);
        var pm=parseNum(document.getElementById('nvi-pm').value);
        var corr=document.getElementById('nvi-corretora').value.trim();
        if(!tk||!qt||!pm){ toast('Preencha o ticker, a quantidade e o preço médio.'); return; }
        novoInv.ticker=tk; novoInv.quantidade=qt; novoInv.precoMedio=pm; novoInv.corretora=corr;
      }else{
        var nvn=document.getElementById('nvi-nome').value.trim();
        var vvi=parseNum(document.getElementById('nvi-val').value);
        if(!nvn||!vvi){ toast('Preencha o nome e o valor aplicado.'); return; }
        novoInv.nome=nvn; novoInv.valorAplicado=vvi;
        if(tpi==='selic'||tpi==='txpre'||tpi==='ipca'){
          var qtit=parseNum(document.getElementById('nvi-qtdtit').value);
          if(qtit) novoInv.quantidadeTitulos=qtit;
        }
        novoInv.instituicao=document.getElementById('nvi-instituicao').value.trim();
        novoInv.vencimento=document.getElementById('nvi-venc').value||'';
        novoInv.liquidez=document.getElementById('nvi-liquidez').value;
        if(((tpi==='cdb')&&document.getElementById('nvi-rent').value==='pre')||tpi==='txpre'){
          var txp=parseNum(document.getElementById('nvi-taxa').value);
          if(!txp){ toast('Preencha a taxa contratada ao ano.'); return; }
          novoInv.rentabilidade='pre'; novoInv.taxaPrefixada=txp;
        }else if(tpi==='selic'||tpi==='ipca'){
          var spreadVal=parseNum(document.getElementById('nvi-spread').value)||0;
          if(tpi==='selic') novoInv.spreadSelic=spreadVal; else novoInv.spreadIpca=spreadVal;
        }else{
          novoInv.rentabilidade='pos'; novoInv.percIndexador=parseNum(document.getElementById('nvi-perc').value)||100;
        }
      }
      investimentos.push(novoInv);
      await sset(KEY_INVEST,investimentos); render();
      atualizarMercado(); return;
    }
    if(act==='atualizar-mercado'){ await atualizarMercado(); return; }
    if(act==='export-jobs'){ exportarJobs(); return; }
    if(act==='export-backup'){ await exportarBackup(); return; }
    if(act==='import-backup'){ document.getElementById('arqBackup').click(); return; }
    if(act==='export'){ exportarCSV(); return; }
    if(act==='reset'){
      if(!confirm('Isso apaga tudo e volta para agosto vazio, só com a lista de contas fixas. Continuar?')) return;
      for(var k=0;k<meses.length;k++){ try{ await window.storage.delete(keyMes(meses[k])); }catch(e){} }
      try{ await window.storage.delete(KEY_CFG); }catch(e){}
      await iniciar(true); return;
    }
    if(act==='sair'){ await window.__sairApp(); return; }
  });

  document.addEventListener('change',async function(ev){
    var el=ev.target; if(!el.dataset) return;

    if(el.dataset.rev){
      var it=imp.itens&&imp.itens.filter(function(x){return x.tid===el.dataset.tid;})[0];
      if(!it) return;
      if(el.dataset.rev==='usar') it.usar=el.checked;
      if(el.dataset.rev==='parcelado') it.parcelado=el.checked;
      if(el.dataset.rev==='descricao') it.descricao=el.value.trim()||'Gasto';
      if(el.dataset.rev==='categoria') it.categoria=el.value;
      if(el.dataset.rev==='valor') it.valor=Math.abs(parseNum(el.value));
      render(); return;
    }
    if(el.id==='imp-conta'){ imp.conta=el.value; return; }
    if(el.id==='nvi-tipo'){ tipoNovoInvest=el.value; rentNovoInvest='pos'; render(); return; }
    if(el.id==='nvi-rent'){ rentNovoInvest=el.value; render(); return; }

    if(el.dataset.jedit){
      var jx=jobs.filter(function(x){return x.id===el.dataset.id;})[0];
      if(jx){
        if(el.dataset.jedit==='tipo') jx.tipo=el.value;
        else if(el.dataset.jedit==='recebido') jx.recebido=Math.abs(parseNum(el.value));
        else jx.valor=Math.abs(parseNum(el.value));
        await sset(KEY_JOBS,jobs); render();
      }
      return;
    }
    if(el.dataset.edit){
      var v=parseNum(el.value),id=el.dataset.id,tp=el.dataset.edit,alvo=null;
      if(tp==='entrada') alvo=mes.entradas.filter(function(x){return x.id===id;})[0];
      if(tp==='fixa') alvo=mes.fixas.filter(function(x){return x.id===id;})[0];
      if(tp==='lanc') alvo=mes.lancamentos.filter(function(x){return x.id===id;})[0];
      if(alvo){
        alvo.valor=v;
        if(alvo.refId&&(tp==='fixa'||tp==='entrada')){
          var lista=tp==='fixa'?cfg.contasFixas:cfg.entradasFixas;
          var tpl=lista.filter(function(x){return x.id===alvo.refId;})[0];
          if(tpl){ tpl.valor=v; await sset(KEY_CFG,cfg); }
        }
        await salvar(); render();
      }
      return;
    }
    if(el.dataset.catedit){
      var idc=el.dataset.id,tpc=el.dataset.catedit,alvoc=null;
      if(tpc==='fixa') alvoc=mes.fixas.filter(function(x){return x.id===idc;})[0];
      if(tpc==='lanc') alvoc=mes.lancamentos.filter(function(x){return x.id===idc;})[0];
      if(alvoc){
        alvoc.categoria=el.value;
        if(tpc==='fixa'&&alvoc.refId){
          var tplc=cfg.contasFixas.filter(function(x){return x.id===alvoc.refId;})[0];
          if(tplc){ tplc.categoria=el.value; await sset(KEY_CFG,cfg); }
        }
        await salvar(); render();
      }
      return;
    }
  });

  async function corrigirSeedJobs(){
    var flag=await sget('fin:jobs_seed_v2');
    if(flag) return;
    jobs=jobs.filter(function(j){ return j.grupo!=='seed-izaldo' && j.grupo!=='seed-helo'; });
    var valores={'2026-01':9900,'2026-02':18900,'2026-03':1500,'2026-04':14600,'2026-05':13150,'2026-06':14000,'2026-07':15750,'2026-08':12500};
    Object.keys(valores).forEach(function(id){
      jobs.push({id:uid(),grupo:'seed-total',cliente:'Faturamento do mês',tipo:'avulso',mes:id,data:id+'-01',valor:valores[id],recebido:0});
    });
    await sset(KEY_JOBS,jobs);
    await sset('fin:jobs_seed_v2',true);
  }

  async function garantirDraHeloisa(){
    var ja=mes.entradas.some(function(e){ return /helo[ií]sa/i.test(e.nome||''); });
    if(ja) return;
    var tpl=cfg.entradasFixas.filter(function(e){return /helo[ií]sa/i.test(e.nome||'');})[0];
    var rid;
    if(tpl){ rid=tpl.id; }
    else{ rid='e'+uid(); cfg.entradasFixas.push({id:rid,nome:'Dra. Heloísa',valor:5500}); await sset(KEY_CFG,cfg); }
    mes.entradas.push({id:uid(),refId:rid,nome:'Dra. Heloísa',valor:5500});
    await salvar();
  }

  async function corrigirMarco(){
    var flag=await sget('fin:jobs_fix_mar');
    if(flag) return;
    var alvo=jobs.filter(function(j){return j.grupo==='seed-total'&&j.mes==='2026-03';})[0];
    if(alvo){ alvo.valor=15000; await sset(KEY_JOBS,jobs); }
    await sset('fin:jobs_fix_mar',true);
  }
  // versão antiga guardava tudo em localStorage; se ainda houver dados
  // aqui neste navegador e o servidor estiver vazio, migra pra API uma
  // única vez em vez de simplesmente semear do zero.
  async function migrarLocalParaServidor(){
    var chaves=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf('fin:')===0) chaves.push(k);
      }
    }catch(e){ return false; }
    if(!chaves.length) return false;
    for(var j=0;j<chaves.length;j++){
      await window.storage.set(chaves[j],localStorage.getItem(chaves[j]));
    }
    chaves.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    return true;
  }

  async function iniciar(forcar){
    cfg=forcar?null:await sget(KEY_CFG);
    if(cfg&&cfg.versao!==VERSAO) cfg=null;
    if(!cfg&&!forcar){
      var migrou=await migrarLocalParaServidor();
      if(migrou){ cfg=await sget(KEY_CFG); if(cfg&&cfg.versao!==VERSAO) cfg=null; }
    }
    if(!cfg){
      var antigos=await slist('fin:mes:');
      for(var j=0;j<antigos.length;j++){ try{ await window.storage.delete(antigos[j]); }catch(e){} }
      cfg=cfgSemente();
      await sset(KEY_CFG,cfg);
      await sset(keyMes('2026-08'),mesNovo('2026-08',cfg));
    }
    meses=await carregarMeses();
    jobs=await sget(KEY_JOBS)||[];
    await corrigirSeedJobs();
    await corrigirMarco();
    financ=await sget(KEY_FIN)||[];
    investimentos=await sget(KEY_INVEST)||[];
    mercado=await sget(KEY_MERCADO)||{cdi:[],selic:[],acoes:{},tesouro:[],atualizadoEm:null};
    if(!meses.length){ await sset(keyMes('2026-08'),mesNovo('2026-08',cfg)); meses=['2026-08']; }
    var alvo=meses.indexOf(hojeId())>-1?hojeId():meses[meses.length-1];
    mesId=alvo; mes=await sget(keyMes(alvo))||mesNovo(alvo,cfg);
    imp.conta=cfg.contas[0].id;
    await garantirDraHeloisa();
    render();
  }

  function erroBoot(){
    document.getElementById('app').innerHTML='<div class="wrap"><p class="boot">Não consegui abrir o armazenamento. Recarregue a página para tentar de novo.</p></div>';
  }

  var usuarioLogado=null;

  function telaLogin(msgErro){
    document.getElementById('app').innerHTML=
      '<div class="login-screen">'+
        '<div class="login-card">'+
          '<h1>Financeiro 2026</h1>'+
          '<p class="login-subtitle">Entre com seu usuário abaixo para acessar seu controle financeiro</p>'+
          (msgErro?'<div class="erro login-error">'+esc(msgErro)+'</div>':'')+
          '<div class="login-field">'+
            '<label for="login-usuario">Usuário</label>'+
            '<input type="text" id="login-usuario" placeholder="Seu usuário" autocapitalize="off" autocorrect="off" autocomplete="username">'+
          '</div>'+
          '<div class="login-field login-password">'+
            '<label for="login-senha">Senha</label>'+
            '<input type="password" id="login-senha" placeholder="Sua senha" autocomplete="current-password">'+
          '</div>'+
          '<button class="login-btn" id="login-btn">Entrar</button>'+
        '</div>'+
      '</div>';
    var campoUsuario=document.getElementById('login-usuario');
    var campoSenha=document.getElementById('login-senha');
    campoUsuario.focus();
    campoUsuario.addEventListener('keydown',function(e){ if(e.key==='Enter') campoSenha.focus(); });
    campoSenha.addEventListener('keydown',function(e){ if(e.key==='Enter') tentarLogin(); });
    document.getElementById('login-btn').addEventListener('click',tentarLogin);
  }

  async function tentarLogin(){
    var usuario=document.getElementById('login-usuario').value.trim();
    var senha=document.getElementById('login-senha').value;
    var btn=document.getElementById('login-btn');
    if(!usuario||!senha){ telaLogin('Preencha usuário e senha.'); return; }
    if(btn){ btn.disabled=true; btn.textContent='Entrando…'; }
    try{
      var resp=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:usuario,senha:senha})});
      var data=await resp.json().catch(function(){ return {}; });
      if(resp.ok){ usuarioLogado=data.usuario||usuario; iniciar(false).catch(erroBoot); }
      else{ telaLogin(data.error||'Usuário ou senha incorretos.'); }
    }catch(e){
      telaLogin('Não consegui falar com o servidor. Tente de novo.');
    }
  }

  async function sair(){
    try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
    location.reload();
  }
  window.__sairApp=sair;
  window.__usuarioLogado=function(){ return usuarioLogado; };
  window.__onUnauthorized=function(){ telaLogin(); };

  (async function(){
    try{
      var resp=await fetch('/api/session');
      var data=await resp.json().catch(function(){ return {}; });
      if(resp.ok){ usuarioLogado=data.usuario||null; await iniciar(false); }
      else telaLogin();
    }catch(e){ erroBoot(); }
  })().catch(erroBoot);
})();
</script>
