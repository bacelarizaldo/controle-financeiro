<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle financeiro 2026</title>
<style>html,body{margin:0;padding:0;background:#F2F3EE}</style>
</head>
<body>
<div id="app">
  <div id="boot" class="boot">Abrindo seu controle…</div>
</div>
<input type="file" id="arqBackup" accept="application/json" style="display:none">

<style>
  :root{
    --paper:#F2F3EE;
    --card:#FFFFFF;
    --ink:#1B2A2E;
    --muted:#5E6B6B;
    --rule:#D8DBD3;
    --rule-soft:#E7E9E3;
    --green:#2E6B4E;
    --green-esc:#1B4A37;
    --red:#9A3B2C;
    --amber:#8C6712;
    --azul:#2A5FA8;
    --azul-esc:#1E3F70;
    --violeta:#7A4FB0;
    --violeta-esc:#4F3178;
    --indigo:#35528F;
    --indigo-esc:#233A66;
    --rose:#A8496B;
    --rose-esc:#722F49;
    --ambron:#8C6712;
    --ambron-esc:#5E430C;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(27,42,46,.05),0 1px 1px rgba(27,42,46,.04);
    --shadow-md:0 2px 6px rgba(27,42,46,.05),0 12px 28px rgba(27,42,46,.08);
    --ring:0 0 0 3px rgba(27,42,46,.09);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  #app *{box-sizing:border-box}
  #app{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.45;padding:0 0 64px}
  #app:has(>.login-screen){padding-bottom:0}
  #app button{font-family:inherit;font-size:inherit;cursor:pointer}
  #app input,#app select,#app textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
  .num,.val{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .boot{padding:48px 20px;color:var(--muted)}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 16px;flex-wrap:wrap}
  .mesnav{display:flex;align-items:center;gap:8px}
  .mesnav h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;min-width:170px;text-align:center}
  .arrow{border:none;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
  .arrow:hover{box-shadow:var(--shadow-md)}
  .arrow:active{transform:scale(.94)}
  .arrow:disabled{opacity:.35;box-shadow:none;background:transparent;cursor:default;transform:none}
  .toolbtn{border:none;background:var(--card);color:var(--muted);padding:8px 15px;border-radius:999px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,color .15s}
  .toolbtn:hover{color:var(--ink);box-shadow:var(--shadow-md)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}

  .hero{background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);padding:28px 26px 24px;margin-bottom:20px;box-shadow:var(--shadow-md)}
  .hero.hero-jobs{background:linear-gradient(155deg,var(--indigo-esc),var(--indigo))}
  .hero.hero-cartoes{background:linear-gradient(155deg,var(--rose-esc),var(--rose))}
  .hero.hero-financ{background:linear-gradient(155deg,var(--ambron-esc),#B4870F)}
  .hero.hero-invest{background:linear-gradient(155deg,var(--green-esc),var(--green))}
  .hero-label{font-size:13px;color:rgba(242,243,238,.68);margin-bottom:2px}
  .hero-num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:54px;line-height:1.02;font-weight:600;letter-spacing:-0.02em}
  .hero-num.neg{color:#F2C4B4}
  .hero-sub{font-size:13px;color:rgba(242,243,238,.68);margin-top:8px;max-width:54ch}
  .hero-grid{display:flex;flex-wrap:wrap;gap:0 34px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(242,243,238,.16)}
  .hero-cell span{display:block;font-size:12px;color:rgba(242,243,238,.68)}
  .hero-cell b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}

  .cartao-boxes{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .cartao-box{flex:1;min-width:170px;border-radius:var(--radius-md);padding:18px 20px;color:var(--paper);box-shadow:var(--shadow-sm)}
  .cartao-box span{display:block;font-size:12.5px;color:rgba(242,243,238,.75)}
  .cartao-box b{display:block;font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;margin-top:4px}
  .cartao-box.c-azul{background:linear-gradient(155deg,var(--azul-esc),var(--azul))}
  .cartao-box.c-ultravioleta{background:linear-gradient(155deg,var(--violeta-esc),var(--violeta))}

  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:#0A0A0A;
    color:#F5F5F5;
  }
  .login-card{
    width:min(100%,466px);
    background:#181818;
    border:1px solid #303030;
    border-radius:18px;
    padding:28px 30px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.28);
  }
  .login-card h1{
    margin:0 0 5px;
    font-family:var(--sans);
    font-size:20px;
    line-height:1.3;
    font-weight:650;
    letter-spacing:-.02em;
    color:#F4F4F4;
  }
  .login-subtitle{
    margin:0 0 30px;
    color:#999;
    font-size:15px;
    line-height:1.5;
  }
  .login-field{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:24px;
  }
  .login-field label{
    font-size:14px;
    font-weight:600;
    color:#E8E8E8;
  }
  .login-field input{
    width:100%;
    height:44px;
    padding:0 14px;
    border:1px solid #414141;
    border-radius:9px;
    background:#222;
    color:#F2F2F2 !important;
    font-family:var(--sans);
    font-size:15px;
    outline:none;
   transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .login-field input::placeholder{color:#888}
  .login-field input:focus{
    border-color:#666;
    background:#242424;
    box-shadow:0 0 0 3px rgba(255,255,255,.07);
  }
  .login-password{margin-bottom:28px}
  .login-btn{
    width:100%;
    height:44px;
    border:1px solid #3D3D3D;
    border-radius:9px;
    background:#242424;
    color:#F3F3F3;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .login-btn:hover{background:#2C2C2C;border-color:#505050}
  .login-btn:active{transform:scale(.995)}
  .login-btn:disabled{opacity:.55;cursor:default;transform:none}
  .login-error{margin-bottom:20px;background:#3A1E1A;color:#F0B7AD;border:1px solid #5A2B24}
  @media(max-width:520px){
    .login-screen{padding:20px 16px}
    .login-card{padding:24px 20px 22px;border-radius:14px}
    .login-subtitle{font-size:14px;margin-bottom:26px}
  }

  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select{border:1px solid var(--rule);background:#fff;border-radius:var(--radius-sm);padding:7px 10px;height:38px;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:var(--ring)}
  #app .w-val{width:128px;text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}

  section{background:var(--card);border-radius:var(--radius-lg);padding:24px 26px 22px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule-soft);padding-bottom:14px;margin-bottom:8px}
  .sec-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
  .sec-total{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .sec-note{font-size:12.5px;color:var(--muted);padding:7px 0 0;max-width:70ch}

  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 8px 8px;border-bottom:1px solid var(--rule-soft);text-transform:uppercase;letter-spacing:.03em}
  td{padding:11px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .linha-total td{background:#F3F5EF;padding-top:13px;padding-bottom:13px}
  .linha-total td:first-child{padding-left:10px;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
  .linha-total td:last-child{padding-right:10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  th:first-child,td:first-child{padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  .r{text-align:right}.c{text-align:center}
  .nome{font-weight:500}
  .ib-filmes{text-transform:uppercase;font-weight:700;letter-spacing:.01em}
  .dim{color:var(--muted);font-size:13px}

  .chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:500}
  .chip.pago{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.apagar{border-color:transparent;background:#F6EFDC;color:var(--amber)}
  .chip.vencido{border-color:transparent;background:#F6E5E1;color:var(--red)}
  .chip.parcela{border-color:transparent;background:#F1E9F8;color:var(--violeta-esc)}
  .chip.avulsa{border-color:var(--rule);background:#fff;color:var(--muted)}
  .chip.inv-selic{border-color:transparent;background:#E7EFF9;color:var(--azul-esc)}
  .chip.inv-txpre{border-color:transparent;background:#E9ECF7;color:var(--indigo-esc)}
  .chip.inv-ipca{border-color:transparent;background:#F3ECD8;color:var(--ambron-esc)}
  .chip.inv-cdb{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.inv-cdi{border-color:transparent;background:#F1E9F8;color:var(--violeta-esc)}
  .chip.inv-acao{border-color:transparent;background:#F7E8EE;color:var(--rose-esc)}
  .chip.ganho{border-color:transparent;background:#E7F1EA;color:var(--green)}
  .chip.perda{border-color:transparent;background:#F6E5E1;color:var(--red)}
  .venc.alerta{color:var(--red)}
  .venc{font-size:12px;color:var(--muted)}

  #app .inline-val{border:1px solid transparent;background:transparent;width:104px;text-align:right;padding:5px 8px;border-radius:var(--radius-sm);font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px;transition:border-color .15s,box-shadow .15s}
  .inline-val:hover{border-color:var(--rule);background:#fff}
  .inline-val:focus{border-color:var(--ink);background:#fff;outline:none;box-shadow:var(--ring)}
  .del{border:none;background:transparent;color:#AAB4B2;font-size:17px;line-height:1;padding:4px 6px;border-radius:var(--radius-sm);transition:color .15s,background .15s}
  .del:hover{color:var(--red);background:#F6E5E1}

  .adder{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 0 2px;border-top:1px solid var(--rule-soft);margin-top:4px}
  .addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-sm);padding:0 18px;height:38px;box-shadow:var(--shadow-sm);transition:background .15s,box-shadow .15s}
  .addbtn:hover{background:#2A3E42;box-shadow:var(--shadow-md)}
  .addbtn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:0 16px;height:38px;transition:background .15s}
  .ghost:hover{background:#EFF1EA}
  .vazio{padding:16px 0;color:var(--muted);font-size:13.5px}

  /* importação por texto */
  .import{border:1px solid var(--rule-soft);border-radius:var(--radius-md);background:#F8F9F5;padding:18px 20px;margin-bottom:6px}
  .import h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
  .import p{margin:0 0 13px;font-size:13px;color:var(--muted);max-width:66ch}
  .imp-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  textarea{width:100%;min-height:92px;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;resize:vertical;font-size:14px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
  .lendo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:18px 0}
  .spin{width:15px;height:15px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .erro{background:#F6E5E1;border:none;color:var(--red);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin-bottom:12px}
  .revisar{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
  .revisar table{font-size:14px}
  #app .revisar select{border:1px solid var(--rule);background:#fff;border-radius:var(--radius-sm);padding:3px 5px;height:29px;font-size:13px;max-width:130px}
  .revisar .inline-val{width:96px}
  .rev-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px}
  .rev-info{font-size:13px;color:var(--muted)}

  .catdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;position:relative;top:-1px}
  .catsel{display:inline-flex;align-items:center;border-radius:999px;padding:3px 6px 3px 11px}
  #app .catsel select.mini{margin-top:0;font-size:12px;font-weight:600;padding:1px 2px}

  .conta-bloco{border:1px solid var(--rule-soft);border-radius:var(--radius-md);margin-top:14px;overflow:hidden}
  .conta-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;background:#EAEDE5;border-left:4px solid var(--rule)}
  .conta-top.c-azul{background:#E7EFF9;border-left-color:var(--azul)}
  .conta-top.c-ultravioleta{background:#F1E9F8;border-left-color:var(--violeta)}
  .conta-top.c-verde{background:#E7F1EA;border-left-color:var(--green)}
  .conta-top.c-selic{background:#E7EFF9;border-left-color:var(--azul)}
  .conta-top.c-txpre{background:#E9ECF7;border-left-color:var(--indigo)}
  .conta-top.c-ipca{background:#F3ECD8;border-left-color:var(--ambron)}
  .conta-top.c-cdb{background:#E7F1EA;border-left-color:var(--green)}
  .conta-top.c-cdi{background:#F1E9F8;border-left-color:var(--violeta)}
  .conta-top.c-acao{background:#F7E8EE;border-left-color:var(--rose)}
  .conta-top b{font-size:14.5px}
  .conta-top .val{font-size:18px;font-weight:600}
  .conta-body{padding:4px 16px 8px}
  .conta-body table{font-size:14px}
  .conta-body h4{margin:14px 0 2px;font-size:12.5px;color:var(--muted);font-weight:600}
  .conta-body h4:first-child{margin-top:10px}

  .grupo-invest-head{display:flex;align-items:center;gap:8px;width:100%;margin:20px 0 8px;padding:10px 12px;border:none;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);font-size:13px;color:var(--ink);font-weight:600;text-align:left;transition:box-shadow .15s}
  .grupo-invest-head:hover{box-shadow:var(--shadow-md)}
  .grupo-invest-nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grupo-invest-head .dim{white-space:nowrap}
  .grupo-invest-seta{color:var(--muted);font-size:11px;width:12px;text-align:center;flex-shrink:0}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
  .fchip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);transition:background .15s,color .15s}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:var(--shadow-md)}
  .rodape{border-top:none;padding-top:6px;font-size:12.5px;color:var(--muted);max-width:68ch}

  .abas{display:flex;gap:2px;padding:5px;margin-bottom:22px;background:#E6E8E0;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .aba{border:none;background:transparent;color:var(--muted);padding:9px 17px;border-radius:999px;font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
  .aba:hover{color:var(--ink)}
  .aba[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
  .aba[data-vista="jobs"][aria-pressed="true"]{background:#E7EAF6;color:var(--indigo-esc)}
  .aba[data-vista="cartoes"][aria-pressed="true"]{background:#F5E9EF;color:var(--rose-esc)}
  .aba[data-vista="financ"][aria-pressed="true"]{background:#F5ECD6;color:var(--ambron-esc)}
  .aba[data-vista="invest"][aria-pressed="true"]{background:#E7F1EA;color:var(--green-esc)}
  .aba[data-vista="resumo"][aria-pressed="true"]{background:#E3F1E7;color:#1E4A38}
  .hero.hero-resumo{background:linear-gradient(155deg,#1E4A38,var(--green))}

  .barras{display:flex;align-items:flex-end;gap:6px;height:190px;padding:12px 0 0}
  .barra-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .barra-topo{height:18px;text-align:center;overflow:hidden;white-space:nowrap}
  .barra-val{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
  .barra-trilho{flex:1;display:flex;align-items:flex-end;background:#E7E9E3;border-radius:5px 5px 0 0}
  .barra-fill{width:100%;background:#8FA69C;border-radius:5px 5px 0 0}
  .barra-fill.alto{background:var(--ink)}
  .barra-rot{text-align:center;font-size:11.5px;color:var(--muted);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .chart-toggle{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 0 4px}
  .chart-toggle-grupo{display:flex;gap:6px}

  .pizza-row{display:flex;gap:28px;flex-wrap:wrap;align-items:center;padding:10px 0 4px}
  .pizza-wrap{position:relative;width:176px;height:176px;flex-shrink:0}
  .pizza-svg{width:176px;height:176px;display:block}
  .pizza-svg circle{transition:opacity .15s}
  .pizza-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 30px}
  .pizza-centro span{font-size:11px;color:var(--muted)}
  .pizza-centro b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:16px;line-height:1.2;margin-top:2px}
  .pizza-legenda{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
  .pizza-legenda-item{display:flex;align-items:center;gap:8px;font-size:13px}
  .pizza-legenda-item .nome{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pizza-legenda-item .pct{color:var(--muted);font-size:12px;width:40px;text-align:right}

  .mini-barras{display:flex;align-items:flex-end;gap:3px;height:36px}
  .mini-barra-col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
  .mini-barra-fill{width:100%;border-radius:2px 2px 0 0;min-height:2px}

  .tipos{display:flex;gap:16px;flex-wrap:wrap;padding:14px 0 2px}
  .tipo-bloco{flex:1;min-width:180px}
  .tipo-rot{font-size:13px;color:var(--muted)}
  .tipo-val{font-size:21px;font-weight:600}
  .tipo-dim{font-size:12.5px;color:var(--muted)}
  #app select.mini{border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;padding:1px 3px;border-radius:var(--radius-sm);margin-top:2px}
  #app select.mini:hover{border-color:var(--rule);background:#fff;color:var(--ink)}
  .linkjob{border:none;background:transparent;color:var(--ink);font-weight:500;padding:0;text-align:left;border-bottom:1px solid var(--rule);font-size:15px}
  .linkjob:hover{border-bottom-color:var(--ink)}

  .lin-recorrente{background:#EEF1F8}
  .lin-avulso{background:#FBEEF1}

<script>
(function(){
  // window.storage agora fala com a API da Vercel (/api/kv), que guarda
  // tudo num banco Postgres — os dados deixam de ficar presos a um
  // navegador/aparelho específico. Se a sessão de login expirar, as
  // chamadas voltam 401 e a gente aciona window.__onUnauthorized (definida
  // no script principal) pra mostrar a tela de senha de novo.
  function semAuth(){
    if(window.__onUnauthorized) window.__onUnauthorized();
    var e=new Error('unauthorized'); e.unauthorized=true; throw e;
  }
  window.storage = {
    get: async function(k){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k));
      if(resp.status===401) semAuth();
      if(!resp.ok){ var e=new Error('not found'); throw e; }
      var data=await resp.json();
      return {key:data.key, value:data.value};
    },
    set: async function(k,v){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k),{
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value:v})
      });
      if(resp.status===401) semAuth();
      if(!resp.ok) return null;
      return {key:k, value:v};
    },
    list: async function(prefix){
      var resp=await fetch('/api/kv?prefix='+encodeURIComponent(prefix||''));
      if(resp.status===401) semAuth();
      if(!resp.ok) return {keys:[]};
      var data=await resp.json();
      return {keys:data.keys||[]};
    },
    delete: async function(k){
      var resp=await fetch('/api/kv?key='+encodeURIComponent(k),{method:'DELETE'});
      if(resp.status===401) semAuth();
      return {key:k, deleted:true};
    }
  };
})();
</script>
<script>

    if(s.indexOf(',')>-1){ s=s.replace(/\./g,'').replace(',','.'); }

  }

  var KEY_CFG='fin:config';

  async function slist(p){ try{ var r=await window.storage.list(p); return (r&&r.keys)?r.keys:[]; }catch(e){ return []; } }

  var cfg=null,mes=null,mesId=null,meses=[],filtroCat='todas';
  var vista='mes', jobs=[], financ=[], filtroTipo='todos';

  var investimentos=[], mercado={cdi:[],selic:[],ipca:[],acoes:{},tesouro:[],atualizadoEm:null}, tipoNovoInvest='cdi', rentNovoInvest='pos', atualizandoMercado=false;
  var KEY_INVEST='fin:investimentos', KEY_MERCADO='fin:mercado_cache';

  var CATEGORIAS=['Moradia','Transporte','Combustível','Saúde','Alimentação','Mercado','Pessoal','Impostos','Serviços','Assinaturas','Lazer','Educação','Cursos','Vestuário','Compras','Pets','Outros'];

  function corCatSuave(c){
    var hex=corCat(c).replace('#',''), r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    return 'rgba('+r+','+g+','+b+',.14)';
  }
  function catSelect(tipo,id,val){
    return '<span class="catsel" style="background:'+corCatSuave(val)+'"><span class="catdot" style="background:'+corCat(val)+'"></span>'+
      '<select class="mini" data-catedit="'+tipo+'" data-id="'+id+'" style="color:'+corCat(val)+'">'+
      CATEGORIAS.map(function(c){return '<option'+(c===val?' selected':'')+'>'+esc(c)+'</option>';}).join('')+
      '</select></span>';
  }

  var REGRAS_CATEGORIA=[
    ['Assinaturas',/netflix|spotify|amazon\s*prime|hbo\s*max|max\b|disney\+|paramount\+|globoplay|deezer|youtube\s*premium|apple\s*(music|tv\+|one)|icloud|google\s*one|assinatura/i],
    ['Compras',/mercado\s*livre|amazon|shopee|aliexpress|shein|magalu|magazine luiza|marketplace/i],
    ['Mercado',/supermercado|hipermercado|mercado\b|hortifruti|a[cç]ougue|sacol[ãa]o|atacad[ãa]o|atacarejo|carrefour|extra\b|assa[íi]|p[ãa]o de a[çc][úu]car|feira\b/i],
    ['Alimentação',/ifood|rappi|uber\s*eats|restaurante|lanchonete|padaria|pizza|burger|mc\s*donald|habib|subway/i],
    ['Combustível',/posto\b|combust[íi]vel|gasolina|etanol|[áa]lcool\b|diesel|shell|ipiranga|petrobras|ale\b/i],
    ['Transporte',/uber|99app|99\s*pop|estacionamento|ped[áa]gio|metr[oô]|[ôo]nibus|passagem a[ée]rea|localiza|movida/i],
    ['Saúde',/farm[áa]cia|drogaria|drogasil|pacheco|clínica|cl[ií]nica|hospital|laborat[oó]rio|exame|dentista|academia\b/i],
    ['Vestuário',/renner|riachuelo|c&a|zara|calçado|cal[çc]ados|marisa|hering|sapataria/i],
    ['Pets',/petz|cobasi|pet\s*shop|veterin[áa]rio|ra[çc][ãa]o/i],
    ['Lazer',/cinema|ingresso|show\b|balada|parque|airbnb|booking\.com|hotel|pousada|bar\b|choperia/i],
    ['Cursos',/curso\b|udemy|alura|hotmart|bootcamp|workshop|treinamento/i],
    ['Educação',/faculdade|universidade|mensalidade escolar|material escolar/i],
    ['Serviços',/claro|vivo\b|tim\b|internet\b|celular\b/i],
    ['Impostos',/\bdas\b|imposto|irpf|inss|inpi|iptu|ipva/i],
    ['Moradia',/aluguel|condom[íi]nio|energia\b|luz\b|[áa]gua\b|g[áa]s\b/i]
  ];
  function categoriaAuto(desc){
    var d=String(desc||'');
    for(var i=0;i<REGRAS_CATEGORIA.length;i++){ if(REGRAS_CATEGORIA[i][1].test(d)) return REGRAS_CATEGORIA[i][0]; }
    return 'Outros';
  }
  function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  var MAPA_CAT_NORM=(function(){ var m={}; CATEGORIAS.forEach(function(c){ m[semAcento(c)]=c; }); return m; })();
  var RX_SEP_TOKEN=/^[-–—•|,;:]+$/;
  function limpaToken(t){ return String(t||'').replace(/^[-–—•|,;:()]+/,'').replace(/[-–—•|,;:()]+$/,''); }
  function extraiCategoriaExplicita(l){
    var tokens=l.split(/\s+/);
    for(var i=0;i<tokens.length;i++){
      var chave=semAcento(limpaToken(tokens[i]));
      if(MAPA_CAT_NORM[chave]){
        var cat=MAPA_CAT_NORM[chave];
        tokens.splice(i,1);
        if(i>0&&RX_SEP_TOKEN.test(tokens[i-1])) tokens.splice(i-1,1);
        else if(i<tokens.length&&RX_SEP_TOKEN.test(tokens[i])) tokens.splice(i,1);
        return {categoria:cat, resto:tokens.join(' ').trim()};
      }
    }
    return null;
  }

  function cfgSemente(){
    return {
      versao:VERSAO,
      contas:[
        {id:'azul',nome:'Cartão Azul',tipo:'cartao'},
        {id:'ultravioleta',nome:'Cartão Ultravioleta',tipo:'cartao'},
        {id:'pix',nome:'Pix',tipo:'pix'}
      ],
      entradasFixas:[],
      contasFixas:[
        {id:'f1',nome:'Plano de saúde',dia:9,valor:1207,categoria:'Saúde'},
        {id:'f2',nome:'Claro Heloísa',dia:10,valor:57.89,categoria:'Serviços'},
        {id:'f3',nome:'Aluguel',dia:15,valor:3200,categoria:'Moradia'},
        {id:'f4',nome:'Streaming Brenda',dia:15,valor:36.85,categoria:'Serviços'},
        {id:'f5',nome:'Energia',dia:18,valor:415.20,categoria:'Moradia'},
        {id:'f6',nome:'DAS CNPJ',dia:20,valor:86.05,categoria:'Impostos'},
        {id:'f7',nome:'Sérgio personal',dia:20,valor:150,categoria:'Pessoal'},
        {id:'f8',nome:'Seguro do carro',dia:30,valor:188,categoria:'Transporte'},
        {id:'f9',nome:'Parcela do carro',dia:30,valor:1285,categoria:'Transporte'},
        {id:'f10',nome:'Parcela do Creta',dia:30,valor:1799,categoria:'Transporte'},
        {id:'f11',nome:'Terapia',dia:30,valor:500,categoria:'Saúde'}
      ]
    };
  }
  function fixasDoCfg(c){
    return c.contasFixas.map(function(f){
      return {id:uid(),refId:f.id,nome:f.nome,dia:f.dia,valor:f.valor,categoria:f.categoria,pago:false};
    });
  }
  function mesNovo(id,c){
    return {
      entradas:c.entradasFixas.map(function(e){return {id:uid(),refId:e.id,nome:e.nome,valor:e.valor};}),
      fixas:fixasDoCfg(c),
      lancamentos:[],
      repasse:0,
      destino:{investir:0,guardar:0,repassar:0}
    };
  }

  function totEntradas(m){ return m.entradas.reduce(function(a,e){return a+(+e.valor||0);},0)+(+m.repasse||0)+totJobsMes(mesId); }
  function totFixas(m){ return m.fixas.reduce(function(a,f){return a+(+f.valor||0);},0); }
  function totLanc(m){ return m.lancamentos.reduce(function(a,l){return a+(+l.valor||0);},0); }
  function totDespesas(m){ return totFixas(m)+totLanc(m); }
  function sobra(m){ return totEntradas(m)-totDespesas(m); }
  function faltaPagar(m){ return m.fixas.filter(function(f){return !f.pago;}).reduce(function(a,f){return a+(+f.valor||0);},0); }
  function totConta(m,cid){ return m.lancamentos.filter(function(l){return l.conta===cid;}).reduce(function(a,l){return a+(+l.valor||0);},0); }
  function nomeConta(id){ var c=cfg.contas.filter(function(x){return x.id===id;})[0]; return c?c.nome:id; }
  function tipoConta(id){ var c=cfg.contas.filter(function(x){return x.id===id;})[0]; return c?c.tipo:'pix'; }
  function statusFixa(f){
    if(f.pago) return 'pago';
    if(mesId<hojeId()) return 'vencido';
    if(mesId>hojeId()) return 'apagar';
    return f.dia<new Date().getDate()?'vencido':'apagar';
  }
  function dataPadrao(){
    if(mesId===hojeId()){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    return mesId+'-01';
  }

  // ---------- leitura de texto colado ----------
  function promptExtracao(){
    return 'Você está lendo um extrato de cartão de crédito ou de conta bancária brasileira, colado como texto.\n'+
      'Extraia SOMENTE os gastos (débitos/compras). Ignore pagamentos de fatura, estornos, créditos, saldos, limites, totais da fatura e qualquer linha que não seja uma compra.\n'+
      'Para cada gasto devolva: data (formato AAAA-MM-DD; se o texto não trouxer o ano, use '+mesId.split('-')[0]+'; se não trouxer nem o mês, use '+mesId+'), descricao (nome do estabelecimento, limpo e curto, sem incluir a categoria; se houver parcela mantenha no formato "Nome (2/6)"), valor (número positivo com ponto decimal) e categoria (exatamente uma de: '+CATEGORIAS.join(', ')+' — se o texto já disser a categoria daquele gasto, use essa categoria informada; só infira pelo nome do estabelecimento quando não vier explícita).\n'+
      'Responda APENAS com um array JSON, sem texto antes ou depois, sem markdown, sem crase. Exemplo: [{"data":"2026-08-12","descricao":"Posto Shell","valor":180.5,"categoria":"Transporte"}]';
  }

  async function lerComIA(texto){
    var content=[{type:'text',text:'Extrato colado:\n'+texto},{type:'text',text:promptExtracao()}];
    var resp=await fetch('/api/read-receipt',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:content})
    });
    var data=await resp.json();
    var txt=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
    txt=txt.replace(/```json/g,'').replace(/```/g,'').trim();
    var ini=txt.indexOf('['), fim=txt.lastIndexOf(']');
    if(ini>-1&&fim>ini) txt=txt.slice(ini,fim+1);
    var arr=JSON.parse(txt);
    if(!Array.isArray(arr)) throw new Error('formato');
    return arr;
  }

  var NAO_GASTO=/pagamento|estorno|cr[ée]dito|limite|saldo|dispon[íi]vel|total da fatura|fatura anterior|fatura fechada|transfer[êe]ncia recebida|recebid/i;

  function lerTextoLocal(texto){
    var out=[];
    texto.split(/\n+/).forEach(function(linha){
      var l=linha.trim(); if(!l) return;
      if(NAO_GASTO.test(l)) return;
      var catExplicita=null;
      var achou=extraiCategoriaExplicita(l);
      if(achou){ catExplicita=achou.categoria; l=achou.resto; }
      var mv=l.match(/(-?\s*(?:R\$)?\s*\d{1,3}(?:\.\d{3})*,\d{2}|\d+[.,]\d{2})\s*$/);
      if(!mv) return;
      var valor=parseNum(mv[1]); if(!valor) return;
      var resto=l.slice(0,l.length-mv[0].length).trim();
      var md=resto.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      var data=mesId+'-01';
      if(md){
        var ano=md[3]?(md[3].length===2?'20'+md[3]:md[3]):mesId.split('-')[0];
        data=ano+'-'+String(md[2]).padStart(2,'0')+'-'+String(md[1]).padStart(2,'0');
        resto=resto.slice(md[0].length).trim();
      }
      resto=resto.replace(/^[\-–•|,;]+/,'').trim();
      if(!resto) resto='Gasto';
      out.push({data:data,descricao:resto,valor:Math.abs(valor),categoria:catExplicita||categoriaAuto(resto)});
    });
    return out;
  }

  var RX_PARCELA=/\(?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)?\s*$/;
  function detectaParcela(desc){
    var m=String(desc||'').match(RX_PARCELA);
    if(!m) return null;
    var atual=+m[1], total=+m[2];
    if(!atual||!total||atual>total||total>60) return null;
    return {atual:atual,total:total};
  }
  function nomeSemParcela(desc){ return String(desc||'').replace(RX_PARCELA,'').trim(); }

  function somaMesesData(d,n){
    var p=String(d||'').split('-'); if(p.length<3) return d;
    var y=+p[0], mo=+p[1]+n, dia=+p[2];
    while(mo>12){ mo-=12; y++; }
    while(mo<1){ mo+=12; y--; }
    var ultimoDia=new Date(y,mo,0).getDate();
    dia=Math.min(dia,ultimoDia);
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
  }

  async function mesGarantido(id){
    var m=await sget(keyMes(id));
    if(!m){
      m=mesNovo(id,cfg);
      await sset(keyMes(id),m);
      meses=await carregarMeses();
    }
    return m;
  }

  // gera nos meses seguintes as parcelas que ainda faltam (atual+1 até total),
  // mantendo o mesmo cartão/categoria/valor e avançando a data mês a mês.
  async function propagarParcelas(base,pc){
    if(!pc||pc.total<=1||pc.atual>=pc.total) return 0;
    var nomeBase=nomeSemParcela(base.descricao);
    var id=mesId, criadas=0;
    for(var i=pc.atual+1;i<=pc.total;i++){
      id=proxId(id);
      var mm=await mesGarantido(id);
      var descNova=nomeBase+' ('+i+'/'+pc.total+')';
      var jaExiste=mm.lancamentos.some(function(l){return l.conta===base.conta&&l.descricao===descNova&&Math.abs((+l.valor||0)-(+base.valor||0))<0.005;});
      if(jaExiste) continue;
      mm.lancamentos.push({
        id:uid(),
        data:somaMesesData(base.data,i-pc.atual),
        descricao:descNova,
        categoria:base.categoria,
        valor:base.valor,
        conta:base.conta,
        parcelado:true
      });
      await sset(keyMes(id),mm);
      criadas++;
    }
    return criadas;
  }

  function normalizar(arr){
    return arr.map(function(x){
      var d=String(x.data||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=mesId+'-01';
      var desc=String(x.descricao||'Gasto').slice(0,80);
      var cat=CATEGORIAS.indexOf(x.categoria)>-1?x.categoria:categoriaAuto(desc);
      var pc=detectaParcela(desc);
      return {tid:uid(),data:d,descricao:desc,valor:Math.abs(+x.valor||0),categoria:cat,usar:true,parcelado:!!pc,parcelaInfo:pc?(pc.atual+'/'+pc.total):''};
    }).filter(function(x){ return x.valor>0; });
  }

  async function processar(texto){
    imp.carregando=true; imp.erro=null; imp.itens=null; render();
    try{
      var arr=await lerComIA(texto);
      imp.itens=normalizar(arr);
      if(!imp.itens.length) imp.erro='Não encontrei nenhum gasto nesse texto.';
    }catch(e){
      var loc=normalizar(lerTextoLocal(texto));
      if(loc.length){ imp.itens=loc; imp.erro='Li o texto sem a ajuda da IA, então as categorias foram um chute a partir do nome. Confira antes de lançar.'; }
      else imp.erro='Não consegui entender esse texto. Cada linha precisa ter um valor no formato 47,90 — data e categoria são opcionais.';
    }
    imp.carregando=false; render();
  }

  var TIPOS=[{id:'recorrente',rot:'Recorrente'},{id:'avulso',rot:'Avulso'},{id:'freela',rot:'Freela'}];
  function tipoJob(j){ return TIPOS.filter(function(t){return t.id===j.tipo;})[0]?j.tipo:'avulso'; }
  function rotTipo(id){ var t=TIPOS.filter(function(x){return x.id===id;})[0]; return t?t.rot:'Avulso'; }

  // ---------- faturamento ----------
  function jobsDoMes(id){ return jobs.filter(function(j){return j.mes===id;}); }
  function totJobsMes(id){ return jobsDoMes(id).reduce(function(a,j){return a+(+j.valor||0);},0); }
  function recebidoJob(j){ return +j.recebido||0; }
  function abertoJob(j){ return Math.max((+j.valor||0)-recebidoJob(j),0); }
  function statusJob(j){
    var r=recebidoJob(j);
    if(r<=0) return {k:'apagar',rot:'A receber'};
    if(r+0.005<(+j.valor||0)) return {k:'apagar',rot:'Parcial'};
    return {k:'pago',rot:'Recebido'};
  }
  function mesesDoAno(ano){
    var out=[]; for(var i=1;i<=12;i++) out.push(ano+'-'+String(i).padStart(2,'0')); return out;
  }

  function barras(valores, rotulos, destaque){
    var max=Math.max.apply(null,valores.concat([1]));
    var h='<div class="barras">';
    valores.forEach(function(v,i){
      var alt=v>0?Math.max(Math.round(v/max*100),3):0;
      h+='<div class="barra-col"'+(v>0?' title="'+esc(rotulos[i])+': '+money(v)+'"':'')+'>';
      h+='<div class="barra-topo">'+(v>0?'<span class="barra-val">'+(v>=1000?(Math.round(v/100)/10).toLocaleString('pt-BR')+'k':Math.round(v))+'</span>':'')+'</div>';
      h+='<div class="barra-trilho"><div class="barra-fill'+(destaque===i?' alto':'')+'" style="height:'+alt+'%"></div></div>';
      h+='<div class="barra-rot">'+esc(rotulos[i])+'</div></div>';
    });
    return h+'</div>';
  }

  // coluna, mas cada barra com sua própria cor — usado quando as barras
  // representam categorias diferentes (não uma série no tempo)
  function barrasCoradas(fatias){
    var max=Math.max.apply(null,fatias.map(function(f){return f.valor;}).concat([1]));
    var h='<div class="barras">';
    fatias.forEach(function(f){
      var alt=f.valor>0?Math.max(Math.round(f.valor/max*100),3):0;
      h+='<div class="barra-col"'+(f.valor>0?' title="'+esc(f.label)+': '+money(f.valor)+'"':'')+'>';
      h+='<div class="barra-topo">'+(f.valor>0?'<span class="barra-val">'+(f.valor>=1000?(Math.round(f.valor/100)/10).toLocaleString('pt-BR')+'k':Math.round(f.valor))+'</span>':'')+'</div>';
      h+='<div class="barra-trilho"><div class="barra-fill" style="height:'+alt+'%;background:'+f.cor+'"></div></div>';
      h+='<div class="barra-rot">'+esc(f.label)+'</div></div>';
    });
    return h+'</div>';
  }

  // gráfico de pizza (donut) em SVG puro, sem biblioteca — cada fatia é
  // um círculo com stroke-dasharray/offset, técnica padrão pra donut
  // multi-segmento sem precisar calcular arcos manualmente
  function pizzaSVG(fatias,rotuloCentro){
    var total=fatias.reduce(function(a,f){return a+f.valor;},0);
    var r=64,circ=2*Math.PI*r,acc=0;
    var svg='<svg viewBox="0 0 176 176" class="pizza-svg">';
    svg+='<circle cx="88" cy="88" r="'+r+'" fill="none" stroke="var(--rule-soft)" stroke-width="24"></circle>';
    fatias.forEach(function(f){
      if(!(f.valor>0)) return;
      var frac=f.valor/total, comp=frac*circ;
      svg+='<circle cx="88" cy="88" r="'+r+'" fill="none" stroke="'+f.cor+'" stroke-width="24" '+
        'stroke-dasharray="'+comp.toFixed(2)+' '+(circ-comp).toFixed(2)+'" '+
        'stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 88 88)">'+
        '<title>'+esc(f.label)+': '+money(f.valor)+' ('+(frac*100).toFixed(1)+'%)</title>'+
        '</circle>';
      acc+=comp;
    });
    svg+='</svg>';
    var h='<div class="pizza-row"><div class="pizza-wrap">'+svg+
      '<div class="pizza-centro"><span>'+esc(rotuloCentro)+'</span><b>'+money(total)+'</b></div></div>';
    h+='<div class="pizza-legenda">';
    fatias.filter(function(f){return f.valor>0;}).forEach(function(f){
      h+='<div class="pizza-legenda-item"><span class="catdot" style="background:'+f.cor+'"></span>'+
        '<span class="nome">'+esc(f.label)+'</span>'+
        '<span class="pct">'+(total?(f.valor/total*100).toFixed(1):'0.0')+'%</span>'+
        '<span class="val" style="min-width:88px;text-align:right">'+money(f.valor)+'</span></div>';
    });
    h+='</div></div>';
    return h;
  }

  // mini gráfico de colunas (sem eixo/rótulo), usado dentro do card de
  // cada ativo pra mostrar o rendimento dos últimos meses num relance
  function miniBarrasInvest(hist,cor){
    if(!hist||!hist.length) return '';
    var ult=hist.slice(-6);
    var max=Math.max.apply(null,ult.map(function(x){return Math.abs(x.rendimento);}).concat([0.01]));
    var h='<div class="mini-barras">';
    ult.forEach(function(x){
      var alt=Math.max(Math.round(Math.abs(x.rendimento)/max*100),4);
      h+='<div class="mini-barra-col" title="'+esc(nomeMesAno(x.mes))+': '+(x.rendimento>=0?'+':'')+money(x.rendimento)+'">';
      h+='<div class="mini-barra-fill" style="height:'+alt+'%;background:'+(x.rendimento>=0?cor:'var(--red)')+'"></div></div>';
    });
    return h+'</div>';
  }

      var totOrc=0,totRec=0,totFal=0;

  }

  // ---------- financiamentos ----------
  function pagasFin(f){ return Math.min(Math.max(+f.pagas||0,0),+f.total||0); }
  function faltamFin(f){ return Math.max((+f.total||0)-pagasFin(f),0); }
  function restaFin(f){ return faltamFin(f)*(+f.valor||0); }
  function terminoFin(f){
    var n=faltamFin(f); if(!n) return 'quitado';
    var d=new Date(), m=d.getMonth()+n, y=d.getFullYear()+Math.floor(m/12);
    return MESES[m%12]+' de '+y;
  }

  // ---------- investimentos ----------
  var ROT_TIPO_INVEST={selic:'Tesouro Selic',ipca:'Tesouro IPCA+',txpre:'Tesouro Prefixado',cdb:'CDB',cdi:'CDI',acao:'Ações'};
  var CHIP_TIPO_INVEST={selic:'inv-selic',ipca:'inv-ipca',txpre:'inv-txpre',cdb:'inv-cdb',cdi:'inv-cdi',acao:'inv-acao'};
  var COR_TIPO_INVEST={selic:'#2A5FA8',ipca:'#8C6712',txpre:'#35528F',cdb:'#2E6B4E',cdi:'#7A4FB0',acao:'#A8496B'};
  var ORDEM_TIPO_INVEST=['selic','ipca','txpre','cdb','cdi','acao'];
  var gruposInvestFechados={};
  var vistaCarteiraInvest='pizza', agruparCarteiraInvest='tipo';
  function fatiasCarteiraInvest(){
    if(agruparCarteiraInvest==='ativo'){
      return investimentos.map(function(inv){
        var av=valorAtualInvest(inv);
        var nome=inv.tipo==='acao'?(inv.ticker||'').toUpperCase():inv.nome;
        return {label:nome, valor:av!=null?av:baseInvest(inv), cor:COR_TIPO_INVEST[inv.tipo]};
      }).filter(function(f){return f.valor>0;}).sort(function(a,b){return b.valor-a.valor;});
    }
    return ORDEM_TIPO_INVEST.map(function(tipo){
      var doTipo=investimentos.filter(function(i){return i.tipo===tipo;});
      var valor=doTipo.reduce(function(a,i){var av=valorAtualInvest(i); return a+(av!=null?av:baseInvest(i));},0);
      return {label:ROT_TIPO_INVEST[tipo], valor:valor, cor:COR_TIPO_INVEST[tipo]};
    }).filter(function(f){return f.valor>0;});
  }
  function ehRendaFixaInv(i){ return i.tipo==='selic'||i.tipo==='ipca'||i.tipo==='txpre'||i.tipo==='cdb'||i.tipo==='cdi'; }
  function ehPrefixado(inv){ return inv.tipo==='txpre'||(inv.tipo==='cdb'&&inv.rentabilidade==='pre'); }
  function serieDoInvest(inv){ if(inv.tipo==='selic') return mercado.selic; if(inv.tipo==='ipca') return mercado.ipca; return mercado.cdi; }
  function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function diasEntre(d1,d2){ return Math.round((new Date(d2+'T00:00:00')-new Date(d1+'T00:00:00'))/86400000); }
  function fimDoMesISO(mesId2){ var p=mesId2.split('-'),y=+p[0],m=+p[1]; var ultimo=new Date(y,m,0).getDate(); return mesId2+'-'+String(ultimo).padStart(2,'0'); }
  function diasParaVencimento(venc){
    if(!venc) return null;
    var hoje=new Date(); hoje.setHours(0,0,0,0);
    var v=new Date(venc+'T00:00:00');
    return Math.round((v-hoje)/86400000);
  }

  // impostos de renda fixa (Selic, IPCA+, Prefixado, CDB, CDI) — não se
  // aplica a ações, que têm regra de IR totalmente diferente (isenção
  // por venda mensal até R$20mil), não modelada aqui.
  // IOF regressivo — só pesa em resgates com menos de 30 dias corridos
  // (Decreto 6.306/2007, Anexo). Do dia 30 em diante é sempre zero.
  var TABELA_IOF=[96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3];
  function percIOF(diasCorridos){
    if(diasCorridos>=30||diasCorridos<1) return 0;
    return TABELA_IOF[diasCorridos-1];
  }
  // IR regressivo de renda fixa (Lei 11.033/2004) — cai conforme o tempo
  // de aplicação, corridos desde a data de compra até hoje.
  function aliquotaIR(diasCorridos){
    if(diasCorridos<=180) return 22.5;
    if(diasCorridos<=360) return 20;
    if(diasCorridos<=720) return 17.5;
    return 15;
  }
  function diasCorridosInvest(inv){ return Math.max(diasEntre(inv.data,hojeISO()),0); }
  // valor líquido estimado — desconta IOF (se houver) e IR regressivo
  // sobre o rendimento bruto. Não inclui a taxa de custódia da B3, que
  // é pequena e tem regras de isenção que mudam com frequência.
  function valorLiquidoInvest(inv){
    if(!ehRendaFixaInv(inv)) return null;
    var bruto=valorAtualInvest(inv);
    if(bruto==null) return null;
    var rendimentoBruto=bruto-baseInvest(inv);
    if(rendimentoBruto<=0) return bruto;
    var dias=diasCorridosInvest(inv);
    var iof=rendimentoBruto*(percIOF(dias)/100);
    var ir=(rendimentoBruto-iof)*(aliquotaIR(dias)/100);
    return bruto-iof-ir;
  }

  // histórico mês a mês de um prefixado — não depende de dado de mercado
  // nenhum, compõe a taxa anual contratada dia a dia (dias corridos, igual
  // o Tesouro Direto/corretora fazem), não por mês-calendário fechado
  function historicoPrefixado(inv){
    var dataIni=inv.data; if(!dataIni) return [];
    var hoje=hojeISO();
    if(dataIni>=hoje) return [];
    var taxaDia=Math.pow(1+(+inv.taxaPrefixada||0)/100,1/365)-1;
    var base=+inv.valorAplicado||0, out=[], mes=dataIni.slice(0,7), valorAnterior=base;
    while(mes<=hoje.slice(0,7)){
      var fimMes=fimDoMesISO(mes);
      var corte=fimMes<hoje?fimMes:hoje;
      var dias=diasEntre(dataIni,corte);
      var valorAcum=base*Math.pow(1+taxaDia,dias);
      out.push({mes:mes, rendimento:valorAcum-valorAnterior, acumulado:valorAcum});
      valorAnterior=valorAcum;
      mes=proxId(mes);
    }
    return out;
  }
  // taxa mensal efetiva pós-fixada: Tesouro Selic usa spread ADITIVO
  // (ex.: "Selic + 0,073% a.a.", como o próprio Tesouro Direto contrata);
  // CDI/CDB pós-fixado usa percentual MULTIPLICATIVO (ex.: "100% do CDI"),
  // que é como o mercado de CDB de fato cota.
  function taxaMensalEfetiva(inv, taxaIndexadorMes){
    if(inv.tipo==='selic'||inv.tipo==='ipca'){
      var spreadAnual=inv.tipo==='selic'?(+inv.spreadSelic||0):(+inv.spreadIpca||0);
      var spreadMes=Math.pow(1+spreadAnual/100,1/12)-1;
      return (taxaIndexadorMes/100)+spreadMes;
    }
    return (taxaIndexadorMes/100)*((+inv.percIndexador||100)/100);
  }
  // histórico mês a mês de um pós-fixado, aplicando a taxa acumulada
  // (CDI ou Selic) do Banco Central mais o spread ou vezes o percentual
  // contratado, conforme o tipo
  function historicoPosFixado(inv){
    var serie=serieDoInvest(inv);
    if(!serie||!serie.length) return [];
    var mesIni=(inv.data||'').slice(0,7), valor=+inv.valorAplicado||0, out=[];
    serie.forEach(function(p){
      if(p.mes<mesIni) return;
      var rend=valor*taxaMensalEfetiva(inv,p.taxa);
      valor+=rend;
      out.push({mes:p.mes, rendimento:rend, acumulado:valor});
    });
    return out;
  }
  function historicoInvest(inv){ return ehPrefixado(inv)?historicoPrefixado(inv):historicoPosFixado(inv); }

  // acha, na lista de títulos do Tesouro Direto trazida por "Atualizar
  // cotações", o título que corresponde a este investimento — casando
  // por vencimento (data exata) e por tipo (Selic x Prefixado)
  function tituloCorresponde(t,inv){
    if(!t||!inv.vencimento||t.vencimento!==inv.vencimento) return false;
    var n=(t.nome||'').toLowerCase();
    if(inv.tipo==='selic') return n.indexOf('selic')>-1;
    if(inv.tipo==='txpre') return n.indexOf('prefixado')>-1 && n.indexOf('juros semestrais')===-1;
    if(inv.tipo==='ipca') return n.indexOf('ipca')>-1 && n.indexOf('juros semestrais')===-1;
    return false;
  }
  function tituloDoInvest(inv){
    if(!mercado.tesouro||!mercado.tesouro.length) return null;
    for(var i=0;i<mercado.tesouro.length;i++){ if(tituloCorresponde(mercado.tesouro[i],inv)) return mercado.tesouro[i]; }
    return null;
  }
  // valor real de mercado (PU de resgate de hoje × quantidade de
  // títulos) — só existe se a pessoa informou a quantidade de títulos E
  // o Tesouro Direto ainda lista esse título hoje
  function valorAtualTesouroPU(inv){
    if(!inv.quantidadeTitulos) return null;
    var t=tituloDoInvest(inv);
    if(!t||typeof t.precoResgate!=='number') return null;
    return (+inv.quantidadeTitulos)*t.precoResgate;
  }

  // valor atual de um investimento de renda fixa — Tesouro Selic/Prefixado
  // usa o preço unitário real de resgate quando a quantidade de títulos
  // foi informada (marcação a mercado de verdade); senão cai pra
  // estimativa por taxa: prefixado usa a taxa contratada (sempre
  // disponível), pós-fixado depende da série do BCB já ter sido buscada
  function valorAtualRendaFixa(inv){
    if(inv.tipo==='selic'||inv.tipo==='txpre'||inv.tipo==='ipca'){
      var pu=valorAtualTesouroPU(inv);
      if(pu!=null) return pu;
    }
    if(ehPrefixado(inv)){
      var histP=historicoPrefixado(inv);
      return histP.length?histP[histP.length-1].acumulado:(+inv.valorAplicado||0);
    }
    var serie=serieDoInvest(inv);
    if(!serie||!serie.length) return null;
    var hist=historicoPosFixado(inv);
    return hist.length?hist[hist.length-1].acumulado:(+inv.valorAplicado||0);
  }
  function valorAtualAcao(inv){
    var cot=mercado.acoes&&mercado.acoes[(inv.ticker||'').toUpperCase()];
    if(!cot) return null;
    return (+inv.quantidade||0)*cot.preco;
  }
  function valorAtualInvest(inv){ return inv.tipo==='acao'?valorAtualAcao(inv):valorAtualRendaFixa(inv); }
  function baseInvest(inv){ return inv.tipo==='acao'?(+inv.quantidade||0)*(+inv.precoMedio||0):(+inv.valorAplicado||0); }
  function rendimentoInvest(inv){
    var atual=valorAtualInvest(inv), base=baseInvest(inv);
    if(atual==null) return {valor:null,pct:null};
    return {valor:atual-base, pct:base?(atual/base-1)*100:0};
  }

  function rendimentoMensalTotal(){
    var mapa={};
    investimentos.filter(ehRendaFixaInv).forEach(function(inv){
      historicoInvest(inv).forEach(function(h){ mapa[h.mes]=(mapa[h.mes]||0)+h.rendimento; });
    });
    return Object.keys(mapa).sort().map(function(m){ return {mes:m, rendimento:mapa[m]}; });
  }
  function nomeMesAno(mesId2){ var p=mesId2.split('-'); return MESES[+p[1]-1]+'/'+p[0].slice(2); }

  // taxa média mensal (%) da série, últimos N meses em cache — usada só
  // pra projeção simples dos pós-fixados
  function taxaMediaMensal(serie,n){
    if(!serie||!serie.length) return null;
    var ult=serie.slice(-n);
    if(!ult.length) return null;
    return ult.reduce(function(a,p){return a+p.taxa;},0)/ult.length;
  }
  function projecaoInvestRendaFixa(inv,mesesAFrente){
    var atual=valorAtualRendaFixa(inv); if(atual==null) atual=baseInvest(inv);
    if(ehPrefixado(inv)){
      var taxaMes=Math.pow(1+(+inv.taxaPrefixada||0)/100,1/12)-1;
      return atual*Math.pow(1+taxaMes,mesesAFrente);
    }
    var serieRef=serieDoInvest(inv);
    var taxaMedia=taxaMediaMensal(serieRef,6);
    if(taxaMedia==null) return atual;
    return atual*Math.pow(1+taxaMensalEfetiva(inv,taxaMedia),mesesAFrente);
  }
  function projecaoRendaFixa(mesesAFrente){
    var lista=investimentos.filter(ehRendaFixaInv);
    if(!lista.length) return null;
    return lista.reduce(function(a,inv){return a+projecaoInvestRendaFixa(inv,mesesAFrente);},0);
  }

  // Busca uma URL de mercado sem nunca lançar exceção — devolve
  // {error: '...'} em vez de rejeitar, pra uma fonte falhando não
  // esconder o resultado nem o erro das outras.
  async function buscarMercado(url){
    var r;
    try{ r=await fetch(url); }catch(e){ return {error:'falha de rede'}; }
    var data=null;
    try{ data=await r.json(); }catch(e){ return {error:'resposta inválida do servidor (HTTP '+r.status+')'}; }
    if(!r.ok) return {error:(data&&data.error)||('HTTP '+r.status)};
    return data;
  }

  async function atualizarMercado(){
    if(atualizandoMercado) return;
    atualizandoMercado=true;
    try{
      var rf=investimentos.filter(function(i){return ehRendaFixaInv(i)&&!ehPrefixado(i);});
      var minData=rf.reduce(function(m,i){return (!m||i.data<m)?i.data:m;},null);
      var acoes=investimentos.filter(function(i){return i.tipo==='acao'&&i.ticker;});
      var tickers=Array.from(new Set(acoes.map(function(i){return i.ticker.toUpperCase();})));
      var temTesouro=investimentos.some(function(i){return i.tipo==='selic'||i.tipo==='txpre'||i.tipo==='ipca';});

      var chamadas=[
        {nome:'CDI', chave:'cdi', url:'/api/market-data?tipo=cdi'+(minData?'&desde='+minData:'')},
        {nome:'Selic', chave:'selic', url:'/api/market-data?tipo=selic'+(minData?'&desde='+minData:'')},
        {nome:'IPCA', chave:'ipca', url:'/api/market-data?tipo=ipca'+(minData?'&desde='+minData:'')}
      ];
      if(tickers.length) chamadas.push({nome:'Ações', chave:'acao', url:'/api/market-data?tipo=acao&ticker='+encodeURIComponent(tickers.join(','))});
      if(temTesouro) chamadas.push({nome:'Tesouro Direto', chave:'tesouro', url:'/api/market-data?tipo=tesouro'});

      var resultados=await Promise.all(chamadas.map(function(c){ return buscarMercado(c.url); }));
      var porChave={};
      var falhas=[];
      chamadas.forEach(function(c,i){ porChave[c.chave]=resultados[i]; if(resultados[i].error) falhas.push(c.nome+': '+resultados[i].error); });

      mercado={
        cdi: (porChave.cdi&&porChave.cdi.serie)||mercado.cdi,
        selic: (porChave.selic&&porChave.selic.serie)||mercado.selic,
        ipca: (porChave.ipca&&porChave.ipca.serie)||mercado.ipca,
        acoes: Object.assign({},mercado.acoes,(porChave.acao&&porChave.acao.cotacoes)||{}),
        tesouro: (porChave.tesouro&&porChave.tesouro.titulos)||mercado.tesouro,
        atualizadoEm: new Date().toISOString()
      };
      await sset(KEY_MERCADO,mercado);
      toast(falhas.length?('Atualizado com avisos — '+falhas.join(' · ')):'Cotações atualizadas.');
    }catch(e){
      toast('Não consegui atualizar as cotações agora. Tente de novo em instantes.');
    }
    atualizandoMercado=false; render();
  }

  function categoriaTotais(m){
    var mapa={};
    m.fixas.forEach(function(f){ mapa[f.categoria]=(mapa[f.categoria]||0)+(+f.valor||0); });
    m.lancamentos.forEach(function(l){ mapa[l.categoria]=(mapa[l.categoria]||0)+(+l.valor||0); });
    return mapa;
  }

    });

    h+='<div class="field"><label for="nf-nome">Conta</label><input id="nf-nome" style="width:180px" placeholder="Nome da conta"></div>';
    h+='<div class="field"><label for="nf-dia">Dia</label><input id="nf-dia" style="width:62px;text-align:center" placeholder="15"></div>';

    h+='<button class="addbtn" data-act="add-fixa">Adicionar conta fixa</button></div>';
    h+='<div class="sec-note">Contas fixas se repetem sozinhas quando você abre o próximo mês, já como “a pagar”.</div></section>';

    // cartões (subgrupo — soma por cartão, detalhe fica na aba Cartões)
    var cartoesMes=cfg.contas.filter(function(c){return c.tipo==='cartao';});
    var totCartoesMes=cartoesMes.reduce(function(a,c){return a+totConta(m,c.id);},0);
    if(cartoesMes.length){
      h+='<section><div class="sec-head"><h2>Cartões</h2><span class="sec-total">'+money(totCartoesMes)+'</span></div>';
      h+='<table><tbody>';
      cartoesMes.forEach(function(c){
        h+='<tr><td class="nome">'+esc(c.nome)+'</td><td class="r val">'+money(totConta(m,c.id))+'</td>';
        h+='<td class="r" style="width:34px"><button class="linkjob" data-vista="cartoes" title="Ver no detalhe dos cartões">ver</button></td></tr>';
      });
      h+='</tbody></table>';
      h+='<div class="sec-note">Já contado nas saídas do mês — aqui é só a soma por cartão. O detalhe de cada compra fica na aba Cartões.</div></section>';
    }

    // gastos (dinheiro / pix — os de cartão ficam na aba Cartões)
    var lancsTodos=m.lancamentos.slice().sort(function(a,b){return (b.data||'').localeCompare(a.data||'');});
    var lancs=lancsTodos.filter(function(l){ return tipoConta(l.conta)!=='cartao'; });
    var vis=filtroCat==='todas'?lancs:lancs.filter(function(l){return l.categoria===filtroCat;});
    h+='<section><div class="sec-head"><h2>Gastos do mês</h2><span class="sec-total">'+money(lancs.reduce(function(a,l){return a+(+l.valor||0);},0))+'</span></div>';
    h+='<div class="sec-note">Dinheiro, débito e Pix. Compras no cartão ficam na aba Cartões, mas já entram na conta das saídas do mês.</div>';

    var cats=CATEGORIAS.filter(function(c){return lancs.some(function(l){return l.categoria===c;});});
    if(cats.length>1){
      h+='<div class="filtros"><button class="fchip" data-filtro="todas" aria-pressed="'+(filtroCat==='todas')+'">Tudo</button>';
      cats.forEach(function(c){ h+='<button class="fchip" data-filtro="'+esc(c)+'" aria-pressed="'+(filtroCat===c)+'">'+esc(c)+'</button>'; });
      h+='</div>';
    }
    h+='<div class="adder">';
    h+='<div class="field"><label for="nl-data">Data</label><input id="nl-data" type="date" value="'+esc(dataPadrao())+'"></div>';
    h+='<div class="field"><label for="nl-desc">Descrição</label><input id="nl-desc" style="width:180px" placeholder="Mercado, combustível…"></div>';
    h+='<div class="field"><label for="nl-cat">Categoria</label><select id="nl-cat">'+CATEGORIAS.map(function(c){return '<option'+(c==='Alimentação'?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>';
    h+='<div class="field"><label for="nl-conta">Pago com</label><select id="nl-conta">'+cfg.contas.filter(function(c){return c.tipo!=='cartao';}).map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>';}).join('')+'</select></div>';
    h+='<div class="field"><label for="nl-val">Valor</label><input id="nl-val" class="w-val" placeholder="R$ 0,00"></div>';
